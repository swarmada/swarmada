#
# battery-edge — one robot starts low and drains fast to 0 while it keeps
# its task. Drives TelemetryPayload.battery.
#
# What a run shows: the robot takes the task and is still InProgress as
# its battery falls through the teens. In the quickstart it is the only
# candidate (the two other robots report no position), so the scheduler's
# battery-descending tie-break (DefaultScheduler.SelectRobot,
# internal/scheduler/scheduler.go) is not exercised; the quickstart's
# battery-handoff scenario stages that comparison.
#
# NOTE: FleetAction.spec.minBatteryPct exists, but it is a filter on NEW
# assignments (scheduler candidate filter 4), and this scenario's actions do
# not set it. Nothing pulls an ALREADY-assigned task off a robot because its
# battery drops mid-task.
name: battery-edge
description: >
  One robot starts at low battery and drains fast to 0 while it keeps its
  task: it is the only candidate, so no comparison between robots is made.

fleet:
  size: 1
  robot_id_prefix: robot-sim

manifest:
  capabilities:
    - navigation.2d
  hardware:
    - name: lidar_top
      type: Lidar
      model: sim-lidar-v1
  installed_models: []

battery:
  start_percent: 22      # already near the edge
  drain_per_second: 1.0  # fast: past a 20% minBatteryPct within a couple of seconds
  floor_percent: 0

position:
  pattern: static

fault_timeline: []

comms:
  gaps: []

estop:
  trigger: none
