# Vale configuration — Swarmada documentation voice.
#
# Rules live in .vale/styles/Swarmada/. Their rationale is in
# .vale/styles/Swarmada/README.md.
#
# Run locally:   vale .
#
# NOTE: no CI job runs vale today (.github/workflows/ci.yml covers Go, Python,
# proto, Helm and the kind quickstart). Until one exists, this is a local gate
# and an error here does not fail a build.

StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Swarmada

# ── Exemptions ────────────────────────────────────────────────────────────────

# ── Not published: vendored trees ─────────────────────────────────────────────
# Excluded wholesale rather than rule-by-rule. The voice rules govern text a reader
# outside the project will see, and vendored upstream documentation is not that.
#
# The authoring tree's copy of this file additionally exempts its private trees.
# Those paths do not exist here, and naming them in a published file is refused by
# the pre-commit boundary check — so this copy is a deliberate variant. Do not
# promote .vale.ini wholesale.

# Third-party package documentation. Not ours to rewrite.
[venv/**]
BasedOnStyles = ""

# Tooling and agent configuration, not documentation.
[.claude/**]
BasedOnStyles = ""

[.pytest_cache/**]
BasedOnStyles = ""

# Upstream CNCF text, reproduced verbatim. Do not edit to satisfy a style rule.
[CODE_OF_CONDUCT.md]
BasedOnStyles = ""

# Vendored adapter repositories. `make adapters` git-clones these from their own
# upstreams into adapters/external/; nothing here is tracked and nothing here is ours
# to style. An edit to satisfy a rule would be reverted by the next fetch.
[adapters/external/**/*.md]
BasedOnStyles = ""

# The rule files quote the banned terms they ban.
[.vale/**/*.md]
BasedOnStyles = ""

# A changelog records what happened, including wording that has already shipped.
[CHANGELOG.md]
Swarmada.Promises = NO
Swarmada.Ageing = NO

# A roadmap is the one document permitted to describe unshipped work.
[docs/roadmap.md]
Swarmada.Promises = NO

# Signed authorship is the condition under which first person is permitted.
# See "Register by surface" in the voice rules.
[blog/**/*.md]
Swarmada.Neutrality = NO

[talks/**/*.md]
Swarmada.Neutrality = NO
