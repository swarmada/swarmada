# Vale configuration — Swarmada documentation voice.
#
# Rules live in .vale/styles/Swarmada/. Their rationale is in
# .vale/styles/Swarmada/README.md.
#
# Run locally:   vale .
#
# NOTE: no CI job runs vale today (.github/workflows/ci.yml covers Go, Python,
# proto, Helm and the kind quickstart). Until one exists, this is a local gate
# and an error here does not fail a build.

StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Swarmada
# The Plain* rules are the plain-language limits for normative text. They are
# off everywhere and switched on, below, only for the chapters held to them.
Swarmada.PlainActor = NO
Swarmada.PlainDefinitionBold = NO
Swarmada.PlainDefinitionPhrase = NO
Swarmada.PlainExceptionPerSentence = NO
Swarmada.PlainInlineList = NO
Swarmada.PlainKeywordPerSentence = NO
Swarmada.PlainNoteShape = NO
Swarmada.PlainParagraphSentences = NO
Swarmada.PlainParagraphWords = NO
Swarmada.PlainRationale = NO
Swarmada.PlainRefPerSentence = NO
Swarmada.PlainSentenceLength = NO

# ── Exemptions ────────────────────────────────────────────────────────────────

# ── Not documentation: caches, dependencies and tool configuration ────────────
# These are excluded wholesale rather than rule-by-rule. The voice rules govern
# text a reader outside the project will see; none of the trees below is that.
#
# Unpublished working trees are NOT named here. This file is published, and a
# published file must not name a directory a reader cannot open — it would be a
# dangling reference in the public repository and dead configuration besides,
# since no such directory exists in a public checkout. Those exclusions are
# passed on the command line by the maintainer-side wrapper instead, which keeps
# the `[*.md]` catch-all above intact so a newly added published document is
# linted by default rather than silently skipped.

# Third-party package documentation. Not ours to rewrite.
[venv/**]
BasedOnStyles = ""

# Tooling and agent configuration, not documentation.
[.claude/**]
BasedOnStyles = ""

[.pytest_cache/**]
BasedOnStyles = ""

# Upstream CNCF text, reproduced verbatim. Do not edit to satisfy a style rule.
[CODE_OF_CONDUCT.md]
BasedOnStyles = ""

# The rule files quote the banned terms they ban.
[.vale/**/*.md]
BasedOnStyles = ""

# A changelog records what happened, including wording that has already shipped.
[CHANGELOG.md]
Swarmada.Promises = NO
Swarmada.Ageing = NO

# A roadmap is the one document permitted to describe unshipped work.
[docs/roadmap.md]
Swarmada.Promises = NO

# Signed authorship is the condition under which first person is permitted.
# See "Register by surface" in the voice rules.
[blog/**/*.md]
Swarmada.Neutrality = NO

[talks/**/*.md]
Swarmada.Neutrality = NO

# ── Plain-language limits for normative text ──────────────────────────────────
# The safety chapter's normative text is held to the Plain* limits (one RFC 2119
# keyword, at most 25 words and one cross-reference per sentence; at most four
# sentences and 80 words per paragraph or list item; a named actor for every
# requirement; no inline list of three or more conditions; no rationale and no
# in-passing definitions). Text exempt from them: a non-normative note, written
# as a single-paragraph "> " blockquote; tables; code blocks; headings. See the
# Plain* rows in .vale/styles/Swarmada/README.md.
#
# The Fleet Adapter Protocol chapter is held to the same limits only in its
# "The Stop Latch" and "Connection lifecycle" sections. Vale cannot scope a rule
# to a section, so the rules stay off for that file here, and the maintainer-side
# wrapper extracts those two sections and lints them with the same rules.
#
# The second pattern matches the chapter when Vale is given an absolute path.
[{rfcs/rfc-0001-core-spec/safety.md,**/rfcs/rfc-0001-core-spec/safety.md}]
Swarmada.PlainActor = YES
Swarmada.PlainDefinitionBold = YES
Swarmada.PlainDefinitionPhrase = YES
Swarmada.PlainExceptionPerSentence = YES
Swarmada.PlainInlineList = YES
Swarmada.PlainKeywordPerSentence = YES
Swarmada.PlainNoteShape = YES
Swarmada.PlainParagraphSentences = YES
Swarmada.PlainParagraphWords = YES
Swarmada.PlainRationale = YES
Swarmada.PlainRefPerSentence = YES
Swarmada.PlainSentenceLength = YES
