# The identity a static-camera adapter raises events with: create SemanticEvents, nothing else.
# No get, no list, no update, no patch -- and nothing on fleettasks, so it cannot clear a draft.
# events-only-policy.yaml adds what RBAC cannot say: which source it may raise them against.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: camera-events
  namespace: warehouse-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: camera-events-create-only
  namespace: warehouse-a
rules:
  - apiGroups: ["swarmada.io"]
    resources: ["semanticevents"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: camera-events-create-only
  namespace: warehouse-a
subjects:
  - kind: ServiceAccount
    name: camera-events
    namespace: warehouse-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: camera-events-create-only
