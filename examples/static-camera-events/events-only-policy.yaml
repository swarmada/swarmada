#
# The half of least privilege RBAC cannot express: the camera identity may raise events only
# against its own source. No SemanticEvent admission webhook exists, and the platform binds no
# source to a principal, so without this any holder of "create semanticevents" could raise any
# declared type of any source. A ValidatingAdmissionPolicy is evaluated by the API server itself
# (CEL): no controller, webhook or CRD. Kubernetes 1.30 or later.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: camera-events-own-source-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["swarmada.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["semanticevents"]
  matchConditions:
    - name: raised-by-the-camera-identity
      expression: request.userInfo.username == 'system:serviceaccount:warehouse-a:camera-events'
  validations:
    - expression: object.spec.source == 'floor-cameras'
      message: the camera identity may raise events only against the floor-cameras source
      reason: Forbidden
    - expression: >-
        has(object.spec.payload) && size(object.spec.payload) <= 16 &&
        'confidence' in object.spec.payload && 'frameSha256' in object.spec.payload &&
        'model' in object.spec.payload && 'modelVersion' in object.spec.payload
      message: a camera event carries its confidence, frame sha256, model and model version
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: camera-events-own-source-only
spec:
  policyName: camera-events-own-source-only
  validationActions: ["Deny"]
