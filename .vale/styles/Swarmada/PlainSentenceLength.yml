# Plain-language limit 2: a sentence has at most 25 words.
# Flags the 26th word of each over-long sentence. A word is a
# whitespace-separated token holding a letter, a digit or masked inline code
# (Vale masks `code` as asterisks); a lone dash or arrow is not a word.
# Written as a script so that the sentence end is the same as the other Plain*
# rules', whatever Vale's own sentence splitter does: the script splits each
# sentence and list item it is given, with a period, question mark or
# exclamation mark, plus closing quotes or brackets, then a token that does not
# start with a lowercase letter, or the end.
# "e.g." and "i.e." followed by a lowercase word do not end a sentence.
# Scope (Vale 3.23): the sentence scope minus blockquotes, table cells and
# headings, which the limits exempt; and each list item, its own block.
extends: script
message: "This sentence has more than 25 words. Limit: 25 words per sentence."
level: error
scope: ["sentence & ~blockquote & ~table.cell & ~heading", list]
script: |
  text := import("text")
  matches := []
  toks := text.re_find(`\S+`, scope, -1)
  words := 0
  n := 0
  if toks != undefined { n = len(toks) }
  for i := 0; i < n; i++ {
    t := toks[i][0]
    if text.re_match(`[\p{L}\p{N}*]`, t.text) {
      words += 1
      if words == 26 {
        matches = append(matches, {begin: t.begin, end: t.end})
      }
    }
    if text.re_match(`[.?!][)"'’”\]]*$`, t.text) {
      if i == n - 1 || !text.re_match(`^\p{Ll}`, toks[i+1][0].text) {
        words = 0
      }
    }
  }
