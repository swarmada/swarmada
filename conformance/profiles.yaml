#
# The machine-readable conformance profile registry.
#
# This file is the SPINE of the conformance program: it names every surface,
# every profile, every check, and every check's support level, and the harness
# reads it rather than hard-coding a partition. Two self-checks keep it honest
# and both run on every report:
#
#   *0.5  every check id here is defined in its catalog document, and every
#         check defined in a catalog document appears here. A registry that
#         drifts from the prose is the failure mode this program exists to
#         prevent, so drift is a FAILED check and not a review comment.
#   *0.3  no profile, check, fixture or target in this suite names a
#         specification the suite cannot read.
#
# Normative sources, per surface:
#   FleetAdapter     adapters/CONFORMANCE.md  +  RFC-0001 "Conformance Profiles
#                    and Support Levels" (rfcs/rfc-0001-core-spec/conformance-profiles.md)
#   ComputeEndpoint  conformance/COMPUTE-ENDPOINT.md
#   ReactiveBlock    conformance/REACTIVE-BLOCK.md   (a profile OF the FleetAdapter surface)
#   ControlPlane     conformance/CONTROL-PLANE.md
#
# A specification outside the published contract (a draft for review) may reserve check identifiers of its own. It does
# so in a registry OVERLAY kept beside its sources (rfcs/*/conformance-registry.yaml),
# which registry.py merges when the file is present: a checkout that holds the
# specification grades against it, and one that does not names nothing it cannot read
# (*0.3). An overlay adds catalogs, profiles and exclusions; it never changes an entry
# declared here.
#
# Where this registry and a catalog document disagree, the CATALOG governs, and
# where a catalog and the specification disagree, the SPECIFICATION governs
# (RFC-0001 conformance-profiles, "Precedence: the specification overrules the
# tests"). This file is a test artefact. It can be wrong.

apiVersion: conformance.swarmada.io/v1alpha1
kind: ProfileRegistry
# SUITE REVISIONS AND THEIR CLASS. Every revision is declared in `revisions:` below with one
# of two classes, and the class -- not the fact of a bump -- decides whether a result earned
# before it still stands:
#
#   harness        What an implementation must do to pass changed: a check's logic, the set of
#                  checks the harness runs, a check's level, or the rule that turns rows into a
#                  verdict. A result earned before it must be re-earned.
#   profile-layer  Only the grouping, naming or reporting of results changed; every row's
#                  outcome and the verdict rule are unchanged. A result earned before it carries
#                  forward.
#
# A registry row (adapters/REGISTRY.md) names the revision its result was earned at. It is
# STALE when a `harness` revision later than that one is at or below the current revision,
# and CURRENT otherwise. tests/python/test_registry_suite_revision.py enforces the rule on
# every row. A suite revision is provenance recorded beside a result, never a component of
# the contract version an adapter negotiates (ADR-0032, Decision bullet 1).
#
# 2026.10.22.2 -- harness. An assignment for a Custom entry keyed by custom_type carries that
#   custom_type, as a control plane sets it from FleetAction.spec.customType (contract 1.4.0): the
#   served-action assignment, and every C19 probe and control that names a declared entry. C19.1's
#   and C19.3's probes name none and carry none, and C19.5's names its verb only in the payload, on
#   purpose. Without it an adapter that keys its Custom verbs refused every one of them as naming
#   no verb, so C4.2, C3.9 and C16.1 skipped and C3.4, C3.5, C5.8, C17.1, C17.2 and C19.1-C19.3
#   failed on the refusal and not on what they grade. C2.2 grades the terminal report for the
#   action the RegisterAck declares CANCELLED, any state RFC-0001 calls terminal, as C4.2 does: it
#   passed an adapter that sent only ACTION_STATE_STOPPED and failed one that ended the action
#   FAILED or SUCCEEDED. The check set and the levels did not change; what it takes to pass C2.2
#   moved, and an adapter that keys its Custom verbs is graded on rows it could not reach, so a
#   result earned before it is re-earned. The contract version did not move. The reports pending
#   re-recording at 2026.10.22 stay pending at this revision (`pendingReRecording:` below).
#
# 2026.10.22 -- harness. No row reads ACTION_STATE_STOPPED as an end, and C3.6 accepts every
#   disposition the contract defines. STOPPED is the commanded stop and is not terminal (RFC-0001,
#   safety chapter, *terminal*; the proto's ACTION_STATE_STOPPED comment). C4.2 grades the lapsed
#   lease's terminal report, any state RFC-0001 calls terminal (SUCCEEDED, FAILED, CANCELLED,
#   UNKNOWN), and no longer passes an adapter that sends only STOPPED (adapters/CONFORMANCE.md
#   C4.2). C16.1's terminal half and C3.9's wait for the preemptor's end skip a STOPPED and read
#   the report after it. C3.6 accepts CANCEL_DISPOSITION_STOP_UNCONFIRMED (contract 1.4.0), which
#   it failed. The check set and the levels did not change; what it takes to pass C4.2, C16.1,
#   C3.9 and C3.6 moved, so a result earned before it is re-earned. The contract version did not
#   move. The in-tree simulation, template and example-noop adapters now follow the STOPPED of a
#   lease self-stop with a terminal FAILED (end cause ACTION_END_CAUSE_LEASE_EXPIRED). The
#   reports this repository pins, and the profiled reports, are pending re-recording at this
#   revision (`pendingReRecording:` below).
#
# 2026.10.17 -- harness. The harness negotiates the contract version per connection, as a control
#   plane does (RFC-0001, fleet adapter protocol, Package and versioning): 1.4.0 with an adapter
#   that reports a 1.4 version, and the reported 1.3.x otherwise. A connection held to 1.3.x is
#   sent every stop and no AssignAction, so each row that needs an assignment records
#   `contract-predates-obligation` there (C2.2, C3.1-C3.6, C3.8, C3.9, C4.1-C4.4, C6.4, C16.1,
#   C17.1, C17.2, C17.4, C19.1-C19.5, and C5.8 as before), and the cadence drive of C2.3 sends
#   none. The rules that bind every adapter are still graded there: a 1.3.x adapter that does not
#   answer a stop fails. Before it, every compatible adapter was told 1.4.0, so no row ran on a
#   1.3.x connection. The check set and the levels did not change, and a 1.4.0 run
#   grades as before. The contract version did not move. The three simulation-adapter reports
#   this repository pins are re-recorded at this revision from `make conformance-sim` (--latch,
#   1.4.0), and the profiled reports by `make conformance-profiles`. The ROS 2 adapter's report
#   stays pending re-recording.
#
# 2026.10.15 -- harness. Three changes, landed together so the pass bar moves once:
#   1. New C5.8 (MUST, `safety` Core): a stop holds the robot's work until its EstopClear lifts
#      it (RFC-0001, fleet adapter protocol, The Stop Latch, While latched and The clear). It
#      binds a connection at contract 1.4.0; a 1.3.x adapter records
#      `contract-predates-obligation`, never an obligation. Before it, an adapter that reported
#      1.4.0 and kept no latch passed. The simulation adapter keeps the latch with --latch and
#      reports 1.3.0 without it; `make conformance-sim` runs it with --latch. The template keeps
#      it.
#   2. The harness meets the stop latch. It sets the leader term on every Command. On a 1.4.0
#      connection it sends each stop's fence with the stop and clears every stop it issues
#      (EstopClear at leader term 1, then the EstopClearAck) before the next check gives the
#      robot work. It reads each stop's answer by its arm and stop ID (C5, C5.4, C8.3, C14.1),
#      runs C8.3 last, and runs C3.1 and C13.2 before C14.1's stop on the refused session,
#      where no clear may be sent. C5.4 fails a fence answered on ControlStream with no
#      EstopAck on SafetyStream, and no longer fails the CommandResult.estop receipt RFC-0001
#      permits. Before, an adapter that keeps the latch failed C5.2, C5.4, C17.1, C17.2, C3.8,
#      C3.1 and C14.1, and C3.9 was skipped.
#   3. New C19.5 (MUST, `dispatch` Core): a Custom action with no custom_type, whose payload's
#      `operation` names a declared verb, is accepted. C19 takes token 9; the fencing checks'
#      first fresh token moves from 9 to 10. An adapter that declares no Custom verb records
#      `adapter-declares-no-custom-verb`, never an obligation.
#   The contract version did not move. The three simulation-adapter reports this repository
#   pins (the first-run sample, the demo-webhooks overlay and the recorded report they copy)
#   are re-recorded at this revision from `make conformance-sim`, which runs the adapter with
#   --latch at contract 1.4.0. The deployments run it without --latch, at 1.3.0; a run in that
#   mode is conformant too, with C5.8 recorded as `contract-predates-obligation`. The
#   profiled reports in conformance-reports/ are re-recorded at this revision by
#   `make conformance-profiles`. The ROS 2 adapter's report stays pending re-recording.
#
# 2026.10.13 -- harness. CE6.1-CE6.5 leave the ComputeEndpoint `events` profile and
# CP2.3-CP2.5 leave the ControlPlane `endpoint-dispatch` profile; each set is listed under its
# surface's `excluded:`. Their catalog rows state rules RFC-0001's `ComputeEndpoint` chapter
# does not state (it calls `spec.emitsEvents` declarative only), and under RFC-0001's
# precedence rule (conformance profiles, *Precedence*) such a row grades no RFC-0001
# obligation. Graded Core, they let an endpoint or a deployment fail a required profile on an
# obligation the specification does not make, against their own catalog rows, which said
# they grade no RFC-0001 obligation until the chapter states them. `events` keeps CE6.6 as Extended and so has no Core level; `endpoint-dispatch`
# keeps CP2.1 and CP2.2 as Core. The rows are still recorded and still carry a grade on the
# capability sheet; no profile and no verdict counts them until the chapter states the
# rules, and then they return to their profiles under a new revision. What it takes to pass
# moved on two surfaces, so a result earned before it is re-earned. The FleetAdapter
# harness's check set and levels are unchanged (the pinned set below is the 2026.09.29 set),
# and the contract version did not move. The conformance reports this repository pins were
# recorded at 2026.09.29 and are pending re-recording at this revision; the entry below
# names them (`pendingReRecording:`), and the test that compares a pinned report's revision
# with the harness's reads the list from there.
#
# 2026.09.29 -- harness. New C3.9 (MUST, `dispatch` Core): a cancel naming a preempted action
# leaves the preemptor running to completion. The harness preempts in place (an assignment of
# the same type at a strictly higher token, RFC-0001
# #fleet-adapter-protocol-directive-supersession-on-the-wire), then cancels the preempted action
# by name at its own token and at the mark, and requires the preemptor still running and then
# SUCCEEDED. No row sent a cancel naming anything but the running action, so an adapter that
# stops whatever is running on any cancel passed every row and aborted every in-place
# preemptor. To make room below the C3.8 adoption probe, C17's probes move from tokens 15-17 to
# 17-19 and the C3.8 fixture from 18/20 to 20/22; neither row's logic changed. The check set
# changed, so a result earned before it is re-earned. No level moved and the contract version
# did not move.
#
# 2026.09.28 -- harness. C8.3 grades the TERMINAL EstopAck on the EdgeStream: a STOPPING
# receipt is skipped and the terminal ack awaited on C5.6's budget, as the SafetyStream checks
# and the edge node itself do. Before, the first ack was graded, so the two-phase answer C5.2
# requires (STOPPING, then STOPPED) failed a Core row on the EdgeStream alone. The pass bar
# moved, so a result earned before it is re-earned. No check id, no level and not the verdict
# rule changed, and the contract version did not move. The raw harness report now names this
# revision (`suite_revision`).
#
# 2026.09.25 -- profile-layer. Rows a run could not reach are recorded with the adapter as
# the cause rather than left out: C8.2/C8.3 when no EdgeStream was advertised, C3.8/C2.3 when
# the accepting reconnect never completed, C3.1/C3.7 when the refused-session reconnect never
# happened. An absent Core row was graded not-tested-suite-gap, which blamed the suite for an
# adapter behaviour; it is now not-testable-here, which still prevents a pass. C0.1's PASS
# line reports how many recorded causes it can contradict. Every row's outcome, the check set,
# the levels and the verdict rule are unchanged, so a result earned before it carries forward.
#
# 2026.09.24 -- harness. C10.1 (MAY) grades an accepted install that emits no advisory
# progress by what it is. It recorded `optional-declined`, a cause that means the adapter
# declined the command, and C0.1 (MUST) rightly contradicted a decline the run never saw.
# So an adapter doing exactly what CONFORMANCE.md C10.1 permits ("emitting none is
# conformant") was graded NON-CONFORMANT. The row now records `optional-not-exhibited`
# (graded not-supported-by-platform, like a decline, and kept out of the never-an-obligation
# set, like a decline), and C0.1 contradicts that cause only when the arm WAS declined. It is
# still a skip, not a pass: a C10.1 pass reports `provisioning.update-progress` supported.
# A result earned before this revision could be NON-CONFORMANT for that reason alone, so
# it does not carry forward. The check set and levels are unchanged. The harness also binds
# its port exclusively and serves one adapter per run (a second live ControlStream or
# SafetyStream is refused); that changes no row of an isolated run.
#
# 2026.09.22 -- harness. The platform precondition reaches the rows it implies, and every
# report states one limitation of its fixture:
#   1. ADR-0071's precondition already re-graded C5.3 from a plant declaration whose odometry
#      is all `command-derived`. It now re-grades C5.2, C8.3, C14.1 and C3.6 the same way --
#      `not-supported-by-platform`, cause `no-independent-motion-channel`, a cause outside the
#      never-an-obligation set, so the verdict still cannot reach `pass` on such a platform.
#      Left as they were, an adapter giving ADR-0071's honest terminal answer on a robot with
#      no encoder read as four failed Core rows attributed to the adapter. C16.1 is NOT in the
#      set: an unacknowledged cancel that emits no terminal ActionStatusUpdate is an adapter
#      gap whatever the drivetrain can witness, and stays graded from the wire.
#   2. C3.6 joins that set for this revision because `CancelDisposition` has no value meaning
#      "stop commanded, rest unwitnessable"; the enum value is queued as a contract change and
#      this grading is what holds until it lands.
#   3. Every report -- human and JSON -- carries the suite's one stated limitation: goals
#      needing a reversal longer than the fixture's dwell are pre-empted before the reversal
#      completes, so motion rows attest one-directional travel only. Nothing about the
#      fixture changed; the limitation stopped being silent. The next revision sizes the
#      dwell from the plant's declared turn time.
# The harness check set is UNCHANGED (the change is entirely in the profile layer), and the
# class is `harness` all the same: the rule that turns rows into a verdict moved, which is
# what the class names.
#
# 2026.09.19.4 -- harness. Three changes, landed together so the pass bar moves once:
#   1. New C19.3 (an assignment that states no action type is declined INVALID_ACTION) and
#      C19.4 (a declared enum parameter carrying a value outside its `allowed` set is declined
#      INVALID_ACTION), each paired with an acceptance control, in `dispatch` Core. C19.4 is
#      not applicable to an adapter that declares no enum parameter
#      (`adapter-declares-no-enum-param`, never an obligation).
#   2. C5.7 compares an early STOPPED with the larger of the witness's declared resolution
#      and the gap between the last sample showing motion and the first showing rest, so a
#      sparse witness no longer fails a timely STOPPED.
#   3. C19's probes take tokens 1-8; the fencing checks' first fresh token moves from 5 to 9.
#
# 2026.09.19.3 -- harness. Landed together so the pass bar moves once:
#   1. Every assignment probe carries an action type the adapter DECLARED on its scan reply,
#      with the parameters that type declares required; an adapter declaring no action has
#      the rows that need an accepted assignment skipped `adapter-declares-no-action`.
#      C13.2's and C17.4's probes are otherwise acceptable, so their verdicts depend only on
#      the property each names.
#   2. New C19.1 (an undeclared action type is declined INVALID_ACTION) and C19.2 (an
#      assignment missing a declared required parameter is declined INVALID_ACTION), each
#      paired with an acceptance control, in `dispatch` Core; new C12.2 (the snapshot pushed
#      at registration carries the scan reply's catalog) in `discovery` Core.
#   3. New C5.7 (an early STOPPED fails against a motion witness) in `safety` Core, graded
#      not-testable-here without a witness; C5.3 graded not-supported-by-platform from a
#      plant declaration with no independent motion channel (ADR-0071).
#
# 2026.09.19.2 -- harness. Four changes, landed together so the pass bar moves once:
#   1. C11.1 is graded at its catalog level: a declined or unanswered pause/resume is a
#      failed MUST (pause/resume are in RFC-0001's Required-message table), where it was an
#      `optional-declined` skip at MAY. Level labels brought to the catalog on C9.1 (SHOULD),
#      C5.6's skip arm (MUST), and C5.3, C6.3, C18.2 (MUST NOT).
#   2. C6.3 leaves every FleetAdapter profile: RA-1 is the control plane's write policy, so
#      it is graded on the ControlPlane surface as CP8.1 (new `status-discipline` profile).
#   3. The harness's check ids and levels are pinned on this entry (`harnessChecks:`), and
#      tests/python/test_harness_check_set_pinned.py fails when they drift without a new
#      revision.
#   4. A report stored in conformance-reports/ must name its adapter; the Makefile targets
#      pass the real name.
#
# 2026.09.19 -- harness. The report grades every row and states a verdict (ADR-0070): a Core
# row of a required profile that was not measured now prevents `pass`, where before it only
# held its level at `notVerified`. The same run can read `conformant: true` at 2026.09.15 and
# `false` here, so the pass bar moved and every result is re-earned.
#
# 2026.09.15 -- harness. The bump itself added the `sensor-streams` profile to the
# FleetAdapter surface (C18.1-C18.5), closing a registry/catalog drift *0.5 was already
# reporting. That part is profile-layer. It is classified `harness` because the harness it is
# the first revision of is not the harness 2026.09.13 ran: C18.1-C18.5 were added to the
# harness between the two, without a revision of their own, and a harness run went from 57
# recorded checks (48 passed, 1 advisory, 8 skipped, on the simulation adapter) to 62 (53
# passed). Five MUSTs a 2026.09.13 result never faced now count toward the harness's
# `conformant`, so a 2026.09.13 result does not carry forward. The evidence is the record of
# those runs and the registry cells at 2026.09.13, which name a C0-C17 harness; no copy of
# the 2026.09.13 harness survives to diff against.
#
# 2026.09.13 -- harness. Adds the `zone-restrictions` profile to the FleetAdapter surface and
# its checks C17.1-C17.4 (ADR-0058's decline obligation, the declaration behind it, and
# C17.4's requirement that a refusal follow from the subjects that arrived). New checks an
# adapter must pass, so a 2026.09.03 result is re-earned. The contract version did not move.
#
# 2026.09.03 -- harness. Adds C2.4 (the redial re-registers) and moves the pass bar on C2.1,
# C7.2/C7.3, C10.2 and C16.1, so a result earned against 2026.09.02 does not carry forward.
