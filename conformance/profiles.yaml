# The capability tiers, adopted as vocabulary from Open-RMF's fleet-adapter
# integration levels. The tier axis is defined on the FleetAdapter surface and
# selects which profiles that surface is OBLIGED to satisfy. The other two
# surfaces carry a fixed value, stated rather than omitted:
#
#   ComputeEndpoint  ReadOnly, always. An endpoint holds no authority over the
#                    fleet by construction -- its result is data and is never a
#                    command. A ComputeEndpoint
#                    report declaring any other tier is MALFORMED.
#   ControlPlane     NotApplicable. The tier states how much authority an
#                    adapter offers over a fleet; the control plane is the party
#                    holding the authority, not offering it.
tiers:
  - name: ReadOnly
    authority: "Observation without command."
  - name: TrafficLight
    authority: "Observation, plus pause and resume of named capabilities."
  - name: FullControl
    authority: "Observation, pause/resume, plus task assignment and execution under lease."
  - name: NotApplicable
    authority: "The surface offers no fleet authority to grade."

surfaces:

  # ───────────────────────────────────────────────────────────────────────────
  - name: FleetAdapter
    protocolVersion: fleet_adapter.v1
    catalogs:
      - path: adapters/CONFORMANCE.md
        prefixes: [C]
      - path: conformance/REACTIVE-BLOCK.md
        prefixes: [RB]
    tierAxis: true
    tierRequires:
      ReadOnly:     [attestation, handshake, lifecycle, telemetry, safety]
      TrafficLight: [attestation, handshake, lifecycle, telemetry, safety, discovery, traffic]
      FullControl:  [attestation, handshake, lifecycle, telemetry, safety, discovery, traffic, dispatch, lease]
    profiles:
      # Partition of C0-C16, as fixed by the RFC-0001 chapter. Restated here in
      # machine-readable form; that chapter is normative.
      - name: attestation
        core:     [C0.1, C15.1, C15.2, RB0.2, RB0.3, RB0.5]
      - name: handshake
        core:     [C1.1, C1.2, C1.3, C1.4, C13.1]
        extended: [C1.5, C13.2]
        features:
          handshake.reconnect-backoff:  [C1.5]
          handshake.mismatch-refusal:   [C13.2]
      - name: lifecycle
        core:     [C2.1, C2.2, C2.3, C2.4]
      # C6.3 is not here: it grades the control plane's write policy (RA-1) and is graded
      # on the ControlPlane surface as CP8.1. It is listed under `excluded` below.
      # C6.4 (echo the assigned fencing token on ActionStatusUpdate) is graded in `dispatch`:
      # it needs an accepted assignment, which a Read Only or Traffic Light adapter never
      # takes, so in `telemetry` it held those tiers short of a profile they require.
      - name: telemetry
        core:     [C6.1, C6.2]
      # PRECONDITION (ADR-0071): the safety profile is claimable only on a platform with at
      # least one motion channel independent of the command path that can confirm rest. A
      # plant declaration whose odometry is all command-derived grades C5.2, C5.3, C14.1
      # (and, on the `dispatch` and `edge` profiles, C3.6 and C8.3)
      # `not-supported-by-platform` with `no-independent-motion-channel`, a cause kept out
      # of the never-an-obligation set, so the verdict cannot reach `pass` on such a
      # platform. The set is named once, in `conformance/adapter.py`
      # (`PLATFORM_PRECONDITION_CHECKS`), so it cannot be widened in one place and not the
      # other. Any channel that shows motion forbids STOPPED (refute wins). C5.7 grades an
      # early STOPPED against a motion witness, and is not-testable-here without one.
      - name: safety
        precondition: >-
          at least one motion channel independent of the command path that can confirm rest
        core:     [C5.1, C5.2, C5.3, C5.4, C5.5, C5.6, C5.7, C5.8, C14.1, C14.2]
      - name: discovery
        core:     [C12.1, C12.2]
      - name: traffic
        core:     [C11.1]
      - name: dispatch
        # C3.9 is Core: it grades a MUST at every contract version, like C3.1-C3.7. RFC-0001's
        # profile table still lists C3.1-C3.7 as the Core fencing rows, and is owed the same
        # addition.
        core:     [C3.1, C3.2, C3.3, C3.4, C3.5, C3.6, C3.7, C3.9, C6.4, C16.1, C19.1, C19.2, C19.3,
                   C19.4, C19.5]
        # C3.8 is EXTENDED, not core, and for the same reason C13.2 is: it grades MUST only
        # at the contract version this suite attests, and advisory at N-1 (ADR-0032 sets the
        # supported range at N and N-1 minor and states a minor release never invalidates an
        # adapter's qualification). An adapter at N-1 is inside that range (adapters/example-noop
        # declares 1.3.0 against contract 1.4.0), so listing it core would fail the dispatch
        # level of an adapter the control plane admits. As an extended feature a
        # failure marks the FEATURE unsupported and is still counted and disclosed.
        extended: [C3.8]
        features:
          dispatch.fencing-token-adoption: [C3.8]
      - name: lease
        core:     [C4.1, C4.2, C4.3, C4.4]
      - name: edge
        conditional: "RegisterAck.edge_endpoints is non-empty for at least one managed robot"
        core:     [C8.1, C8.2, C8.3]
      - name: provisioning
        extended: [C7.1, C7.2, C7.3, C9.1, C10.1, C10.2]
        features:
          # C10.2 belongs to BOTH install features: it asserts a terminal outcome for
          # every install the adapter ANSWERS, firmware and model alike. Mapping it to
          # push-firmware alone would report a model-install shortfall against the
          # firmware feature and leave model-update reading as supported. A shared pass
          # does not carry a declined command: a feature with an `optional-declined` row
          # (C7.2 for model_update, C7.3 for push_firmware) is unsupported
          # (conformance/registry.py).
          provisioning.push-firmware:   [C7.3, C10.2]
          provisioning.model-update:    [C7.2, C10.2]
          provisioning.verify:          [C9.1]
          provisioning.update-progress: [C10.1]
      # New in Draft 4, and SPLIT IN TWO on purpose.
      #
      # `reactive-grammar` is Core within its own catalog and always applicable, but it
      # gates NO capability tier: RFC-0001 #conformance-profiles-adapter-capability-tiers
      # is the complete statement of what a tier requires and does not name it, and
      # RFC-0001 #conformance-profiles-surfaces-beyond-the-fleet-adapter forbids a report
      # presenting a profile this chapter does not define as bearing on the tier. The
      # profile still runs and is still reported; a failure marks it unheld and leaves the
      # adapter's declared tier unchanged. Its checks
      # are properties of the GRAMMAR as specified and of this suite's coverage
      # of it -- RB0.1 (every construct is covered) and the four MUST NOTs that
      # ask what the grammar OFFERS. They hold identically for every adapter,
      # including one that declines the reactive tier entirely, because an
      # adapter that declines it still ships into a fleet where the grammar is
      # what it is. Folding them into the conditional profile below would make
      # them disappear for exactly the adapters that never implement the tier --
      # which is most of them, and which would leave the guarantee unasserted in
      # nearly every report that exists.
      - name: reactive-grammar
        core:     [RB0.1, RB2.7, RB3.5, RB3.6, RB3.7]
      # `reactive` is what the ADAPTER is held to. Extended at every tier, and
      # holding it never raises the tier: none of the four effects commands
      # motion, so a Read Only adapter may host reactive blocks and stay Read
      # Only.
      - name: reactive
        conditional: "the adapter declares reactive_grammar_version on AdapterHello"
        extended:
          [RB1.1, RB1.2, RB1.3, RB1.4, RB1.5,
           RB2.1, RB2.2, RB2.3, RB2.4, RB2.5, RB2.6,
           RB3.1, RB3.2, RB3.3, RB3.4,
           RB4.1, RB4.2, RB4.3,
           RB5.1, RB5.2, RB5.3,
           RB6.1, RB6.2]
        features:
          reactive.grammar-v1:   [RB1.1, RB1.2, RB1.3, RB1.4, RB1.5,
                                  RB2.1, RB2.2, RB2.3, RB2.4, RB2.5, RB2.6,
                                  RB3.1, RB3.2, RB3.3, RB3.4]
          reactive.execution:    [RB4.1, RB4.2, RB4.3, RB5.1, RB5.2, RB5.3]
          reactive.local-cues:   [RB6.1, RB6.2]
      # ADR-0058, the FleetAdapter half. EXTENDED and conditional, exactly as the
      # specification's conformance-profiles chapter states it: the profile grades an
      # adapter that has taken on the declare/honour/attest obligations, and an adapter
      # that declares no subject has taken on none of them.
      #
      # ALWAYS APPLICABLE, corrected 2026-09-14. It was `conditional: CapabilitiesSnapshot.
      # honoured_operating_constraints is non-empty`, which could not be satisfied alongside
      # the specification's own statement that the load-bearing case is a run going RED
      # against an adapter that ACCEPTS AND IGNORES a rule -- which is an adapter declaring
      # NOTHING. The profile was reported notApplicable for exactly the adapters whose red
      # run it demanded, so a reader saw notApplicable beside a failing MUST from the same
      # profile and had to be told, in two catalogs, that the two were separable.
      #
      # FA-R5's antecedent has no declaring clause: "an adapter that CANNOT honour a rule
      # MUST decline". An adapter that honours nothing cannot honour anything it is sent, so
      # every operating rule that reaches it is one it must decline.
      #
      # NO ROW HERE NEEDED THE CONDITIONAL. C17.1 and C17.2 have no declaring antecedent;
      # C17.3 grades the SHAPE of whatever was declared and declaring none PASSES; C17.4 does
      # need a declaration to exist and carries its own enumerated skip cause for the absence
      # (adapter-declares-no-operating-subject) rather than leaning on the profile. The
      # conditional was buying nothing and costing the contradiction.
      #
      # LIVE, NOT STATIC, and the opposite of the ControlPlane profile of the same name:
      # these rows are graded on messages a running adapter actually sent, where CP7.1 and
      # CP7.2 are read off shipped schemas and establish only that the surface exists.
      - name: zone-restrictions
        extended: [C17.1, C17.2, C17.3, C17.4]
        features:
          # The two decline rows are ONE feature. They are the same obligation with the
          # same observable -- a refusal naming the subject -- separated only by whether
          # the subject is a core one or an unrecognised extension, and an adapter that
          # implements one and not the other has not implemented the obligation.
          zone-restrictions.decline:     [C17.1, C17.2]
          zone-restrictions.declaration: [C17.3]
          # C17.4 is a SEPARATE feature because it grades a different property: that the
          # refusals above are a FUNCTION OF WHAT ARRIVED. An adapter that declines every
          # assignment carrying any operating rule passes both decline rows without ever
          # reading the message, and its green lines would then mean "this adapter
          # declines" rather than "this adapter was told". Requiring an ACCEPTANCE for a
          # set it declared is what separates the behaviour from the reflex, and it is the
          # only row in this family that can establish FA-R2's carry ARRIVED.
          zone-restrictions.arrival:     [C17.4]
      # C18 -- the sensor-stream duty cycle. EXTENDED, because the catalog says the whole
      # family is optional in as many words: an adapter declining `activate_stream`
      # declines the duty cycle for its robots, which is conformant under C7.1 and means
      # nothing activates, so nothing can be left on.
      #
      # ALWAYS APPLICABLE, and NOT conditional on the adapter declaring a stream. C18.1
      # grades the SHAPE of whatever was declared and declaring nothing PASSES -- the
      # catalog states that outright ("Declaring no stream passes") and the harness agrees
      # structurally: `_DECLINE_ARMS` arms C18.2-C18.5 behind `activate_stream` and
      # deliberately leaves C18.1 unarmed. A conditional here would buy nothing and cost
      # the same contradiction zone-restrictions was corrected for on 2026-09-14: the
      # profile would read notApplicable while carrying a row that had actually run.
      #
      # IT GATES NO CAPABILITY TIER, and it is absent from tierRequires on purpose.
      # RFC-0001's tier chapter is the complete statement of what a tier requires and does
      # not name it. The substantive reason is the `reactive` one: switching a sensor on
      # commands no MOTION, so a Read Only adapter may serve sensor streams and stay Read
      # Only. Observation is what a Read Only adapter is FOR.
      - name: sensor-streams
        extended: [C18.1, C18.2, C18.3, C18.4, C18.5]
        features:
          sensor-streams.declaration:         [C18.1]
          # Kept apart from the transport rows because it is the one property that is not
          # about this adapter's own behaviour under command: it is where the BYTES go.
          sensor-streams.off-plane-transport: [C18.2]
          # THE ORDINARY PATH and THE FAIL-SAFE ARE SEPARATE FEATURES, because the catalog
          # says they are different things -- "the lease is the FAIL-SAFE, not the ordinary
          # path" -- and because an adapter can stop cleanly on DeactivateStream and still
          # never stop when abandoned. That second adapter leaves a camera running for a
          # whole lease every time the control plane goes quiet, and the hazard the family
          # exists for is precisely an unattended, still-powered sensor. Folding the two
          # into one feature would let a passing DeactivateStream row report the fail-safe
          # as held.
          sensor-streams.duty-cycle:          [C18.5]
          sensor-streams.lease-failsafe:      [C18.3]
          sensor-streams.clip-windows:        [C18.4]
    excluded:
      - checks: [C6.3]
        reason: >-
          graded on the ControlPlane surface as CP8.1. RA-1 is the control plane's
          status-write policy; nothing an adapter puts on the wire can show it, so the row
          could only ever be unmeasured here and held every adapter's verdict for a
          property of the plane. The harness still records the row, because the catalog
          still lists it on this surface
      - checks: [C0.2, C0.3, C0.4]
        reason: "harness context, not adapter behaviour; does not count toward conformance"
      - checks: [C8.4]
        reason: "an obligation on the Zone Controller edge node, not on an adapter"
      - checks: [C3.10, C3.11]
        reason: >-
          defined in the catalog for draft 4 (the leader term, RFC-0001 fleet adapter
          protocol, The Stop Latch) and not yet run: the harness has no probe for them, so a
          Core or Extended level would leave an unmeasured row on every adapter. They return to
          `dispatch` as an Extended feature under the suite revision that adds their probes
      - checks: [C16.2]
        reason: >-
          defined in the catalog for draft 4 (the retained outcome, RFC-0001 fleet adapter
          protocol, Reconnect Action State Reconciliation) and not yet run: the harness has no
          probe for it, so a Core or Extended level would leave an unmeasured row on every
          adapter. It joins `dispatch` under the suite revision that adds its probe
      - checks: [RB0.4]
        reason: "a registry self-check reported once, on the surface that carries the registry"

  # ───────────────────────────────────────────────────────────────────────────
  - name: ComputeEndpoint
    protocolVersion: compute.v1
    catalogs:
      - path: conformance/COMPUTE-ENDPOINT.md
        prefixes: [CE]
    tierAxis: false
    fixedTier: ReadOnly
    profiles:
      - name: attestation
        core:     [CE0.1, CE0.2, CE0.3, CE0.5]
      - name: invocation
        core:     [CE1.1, CE1.2, CE1.3, CE1.4, CE1.5, CE1.6]
        extended: [CE1.7]
        features:
          invocation.replay-marker: [CE1.7]
      - name: envelope
        core:     [CE2.1, CE2.2, CE2.3, CE2.4, CE2.5, CE2.6, CE2.7, CE2.9]
        extended: [CE2.8]
        features:
          envelope.model-provenance: [CE2.8]
      - name: binding-http
        conditional: "spec.binding is Http"
        core:     [CE3.1, CE3.2, CE3.3, CE3.4, CE3.5, CE3.6]
      - name: binding-grpc
        conditional: "spec.binding is Grpc"
        core:     [CE4.1, CE4.2, CE4.3, CE4.4, CE4.5, CE4.7]
        extended: [CE4.6]
        features:
          binding-grpc.lease-renewal: [CE4.6]
      - name: binding-mcp
        conditional: "spec.binding is Mcp"
        core:     [CE5.1, CE5.2, CE5.3, CE5.4, CE5.5]
        extended: [CE5.6]
        features:
          binding-mcp.schema-drift: [CE5.6]
      # No Core level since 2026.10.13. CE6.1-CE6.5 state rules RFC-0001's ComputeEndpoint
      # chapter does not (it calls `spec.emitsEvents` declarative only), so they are listed
      # under `excluded` below and graded nowhere until the chapter states them. An
      # Extended-only profile is never required (conformance/registry.py), so `events` can
      # no longer hold an endpoint's verdict; CE6.6 is still graded as a feature.
      - name: events
        conditional: "spec.emitsEvents is non-empty"
        extended: [CE6.6]
        features:
          events.delivery-timing-documented: [CE6.6]
      - name: service-contract
        conditional: "spec.contract is Service"
        core:     [CE7.1, CE7.2, CE7.3, CE7.4, CE7.5, CE7.6]
      - name: provenance
        core:     [CE8.1, CE8.3]
        extended: [CE8.2]
        features:
          provenance.model-identity: [CE8.2]
    excluded:
      - checks: [CE0.4]
        reason: "harness context, not endpoint behaviour; does not count toward conformance"
      - checks: [CE6.1, CE6.2, CE6.3, CE6.4, CE6.5]
        reason: >-
          not an RFC-0001 obligation yet. RFC-0001's ComputeEndpoint chapter calls
          spec.emitsEvents declarative only and states none of these rules, and under its
          precedence rule a catalog row grades no obligation the chapter does not state. The
          suite still records the rows; no profile and no verdict counts them until the
          chapter states the rules (suite revision 2026.10.13)

  # ───────────────────────────────────────────────────────────────────────────
  - name: ControlPlane
    protocolVersion: swarmada.io/v1
    catalogs:
      - path: conformance/CONTROL-PLANE.md
        prefixes: [CP]
    tierAxis: false
    fixedTier: NotApplicable
    profiles:
      - name: attestation
        core:     [CP0.1, CP0.2, CP0.3, CP0.5]
      # CP5.5 lives HERE, not in cluster-compute, and the placement is
      # deliberate: a check verifying that a profile was legitimately DECLINED
      # cannot sit inside the profile it declines, or it disappears with it. The
      # decline must be established by a check that always runs, and "the
      # manager holds no pod-create authority" is a containment property in any
      # case: the risk it bounds is privilege escalation.
      - name: containment
        core:     [CP1.1, CP1.2, CP1.3, CP1.4, CP5.5]
      # CP2.3-CP2.5 are not here since 2026.10.13: they are the control plane's half of
      # CE6.3, CE6.4 and CE6.1, rules RFC-0001's ComputeEndpoint chapter does not state, and
      # are listed under `excluded` below with them.
      - name: endpoint-dispatch
        core:     [CP2.1, CP2.2]
      - name: result-is-data
        core:     [CP3.1, CP3.2]
        extended: [CP3.3]
        features:
          result-is-data.approval-default: [CP3.3]
      - name: image-provenance
        core:     [CP4.1, CP4.2]
      # ADR-0058. Core because a deployment that cannot carry the resolved projection
      # cannot have a conforming filter 11 at all -- there is nowhere for the answer to
      # live, so the filter must either re-resolve the tree (FZ-R4 forbids it) or fail
      # open. CP7.1 and CP7.2 are STATIC: they establish the surface, never the behaviour.
      #
      # CP7.3 IS CORE AND IS RECORDED AS UNEXERCISED IN EVERY RUN, deliberately. FA-R2's
      # carry -- the plane FILLING AssignAction.operating_constraints from the resolved
      # projection at the robot's leaf -- is a property of a live dispatch, and no pairing
      # of a running control plane with a running adapter exists in any harness here. The
      # check this profiler COULD run is the one that must not be green: reading the proto
      # descriptor would establish that the schema has a slot, which is exactly what a
      # reader would mistake for "the adapter was told". Listing it Core and skipping it
      # keeps the obligation visible as an obligation rather than deleting it from the
      # registry because it is inconvenient to grade.
      - name: zone-restrictions
        core:     [CP7.1, CP7.2, CP7.3]
      # RA-1, moved from the FleetAdapter surface's C6.3: the obligation is on the party
      # that writes Robot status. Core, and recorded as not exercised in every static run,
      # for the reason CP7.3 is.
      - name: status-discipline
        core:     [CP8.1]
      # EXTENDED, NEVER CORE. A deployment that declines
      # workload-create RBAC must pass Core IN FULL. CP5.5 is the check that
      # asserts the decline is a legitimate outcome rather than a gap.
      - name: cluster-compute
        conditional: "the deployment grants the manager create authority on workload kinds"
        neverCore: true
        extended: [CP5.1, CP5.2, CP5.3, CP5.4]
        features:
          cluster-compute.workload-provisioning: [CP5.1, CP5.2, CP5.3, CP5.4]
      - name: reactive-dispatch
        conditional: "the deployment dispatches ReactiveBlocks"
        extended: [CP6.1, CP6.2, CP6.3, CP6.4]
        features:
          reactive-dispatch.grammar-gate: [CP6.1, CP6.2, CP6.3, CP6.4]
    excluded:
      - checks: [CP0.4]
        reason: "harness context, not control-plane behaviour; does not count toward conformance"
      - checks: [CP2.3, CP2.4, CP2.5]
        reason: >-
          not an RFC-0001 obligation yet. They are the control plane's half of CE6.3, CE6.4
          and CE6.1, and RFC-0001's ComputeEndpoint chapter states none of them (it calls
          spec.emitsEvents declarative only, with nothing validating a raised event against
          it). Under its precedence rule a catalog row grades no obligation the chapter does
          not state. The suite still records the rows; no profile and no verdict counts them
          until the chapter states the rules (suite revision 2026.10.13)

# Specifications this program deliberately asserts NOTHING about. A profile that
# claims support for a specification a stranger cannot read is untestable by a
# stranger, which fails the standing rule that a public test must stand alone.
# Enforced, not merely stated: the *0.3 self-check fails the run if any of these
# names appears in a profile, a check id, a check title, or a fixture path.
excludedSpecifications:
  - name: MHS
    aliases: ["mhs", "machine health services", "machine-health-services"]
    reason: >-
      No public specification, no repository, no license, one vendor in control
      as of 2026-09-01. It stays reachable over the Mcp binding as
      deployment configuration, which commits nothing and is asserted nowhere.
      Re-assess when it publishes under a neutral foundation with a readable
      specification.
