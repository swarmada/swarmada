{{- if .Values.controlStream.enabled -}}
# ControlStream gRPC Service — Fleet Adapters connect here (--fleet-adapter-bind-
# address). The manager terminates mTLS itself (RFC-0001
# #fleet-adapter-protocol-transport-security); its server certificate names this
# Service, so an adapter dials <fullname>-controlstream.<namespace>.svc and verifies
# it. Exposed as ClusterIP by default; set controlStream.service.type=LoadBalancer to
# reach adapters outside the cluster (their certificate must then also carry the
# address they dial).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swarmada.fullname" . }}-controlstream
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmada.labels" . | nindent 4 }}
  {{- with .Values.controlStream.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.controlStream.service.type }}
  selector:
    {{- include "swarmada.selectorLabels" . | nindent 4 }}
  ports:
    - name: controlstream
      port: {{ .Values.controlStream.port }}
      targetPort: controlstream
      protocol: TCP
{{- end }}
