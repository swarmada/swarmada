apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.16.5
  name: fleettasks.swarmada.io
spec:
  group: swarmada.io
  names:
    kind: FleetTask
    listKind: FleetTaskList
    plural: fleettasks
    shortNames:
    - ft
    singular: fleettask
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.actionSummary
      name: Actions
      type: string
    - jsonPath: .spec.desiredState
      name: Desired
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: FleetTask is the Schema for the fleettasks API — the composite
          objective composing FleetActions.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FleetTaskSpec defines the desired composite objective.
            properties:
              actions:
                description: |-
                  Actions is the member set. APPEND-ONLY after creation: existing entries (spec and recorded
                  status) are immutable; new entries may be appended before the task is terminal via the
                  scoped `append` RBAC verb (enforced by the validating webhook). Keyed by name.
                items:
                  description: FleetTaskAction is one member action of a composite
                    FleetTask.
                  properties:
                    action:
                      description: |-
                        Action is a full FleetActionSpec, embedded verbatim and copied unchanged onto the child
                        FleetAction the controller generates for this member.
                      properties:
                        acceptDegradedCapabilities:
                          description: |-
                            AcceptDegradedCapabilities, when true, lets the Scheduler satisfy this action's
                            requiredCapabilities with entries in Degraded status, not only Active. When
                            nil (unset), the namespace default
                            SwarmadaConfig.spec.scheduling.defaultAcceptDegradedCapabilities applies, and
                            a per-action value overrides that default — so this is a pointer with no static
                            CRD default (a plain defaulted bool could not distinguish unset from false).
                            This relaxes only the capability-status requirement; degraded parametric
                            constraints additionally require a capability-level degradedPolicy.
                          type: boolean
                        constraints:
                          additionalProperties:
                            type: number
                          description: |-
                            Constraints are parametric filter predicates (§6.10.3): each entry maps a
                            capability parameter name to the MINIMUM value a candidate robot must resolve.
                            A robot matches only if it has an Active capability whose
                            status.capabilities[].resolvedParameters[<name>] is >= the constraint (e.g.
                            constraints.maxPayloadKg: 30 requires an Active transport.payload resolving
                            maxPayloadKg >= 30). A parameter no Active capability resolves is treated as
                            unsatisfied (fail-closed), so the robot is excluded.
                          type: object
                        deadline:
                          description: |-
                            Deadline is the latest time by which this action must start.
                            Actions that cannot start before their deadline are moved to Failed.
                          format: date-time
                          type: string
                        desiredState:
                          allOf:
                          - enum:
                            - Running
                            - Paused
                            - Returning
                            - Cancelled
                          - enum:
                            - Running
