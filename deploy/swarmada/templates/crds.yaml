apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.16.5
  name: robots.swarmada.io
spec:
  group: swarmada.io
  names:
    kind: Robot
    listKind: RobotList
    plural: robots
    shortNames:
    - rob
    singular: robot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .status.batteryPercent
      name: Battery
      type: integer
    - jsonPath: .status.assignedAction
      name: Action
      type: string
    - jsonPath: .spec.robotClass
      name: Class
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Robot is the Schema for the robots API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RobotSpec defines the desired state of a Robot (RFC-0001 §Robot Schema).
              When RobotClass is set, Hardware / InstalledModels / Capabilities entries
              declared here are merged union-by-name over the class's inherited entries
              (a same-named entry fully overrides the class's); Constraints and Charging
              are whole-value overrides. See RobotClassSpec for the merge semantics.

              Both rules are guarded with !has(self.capabilities) since capabilities is
              optional — a Robot that omits it entirely (the common case; capabilities
              are frequently supplied only via RobotClass/ModelRollout) must not fail CEL
              evaluation with "no such key: capabilities".
            properties:
              adapter:
                description: Adapter is the Fleet Adapter binding for this robot.
                properties:
                  name:
                    description: Name must match an installed FleetAdapter resource
                      in this namespace.
                    minLength: 1
                    type: string
                  version:
                    description: |-
                      Version is used by the OTA/Model Update Manager to validate compatibility
                      before pushing firmware; admission rejects mismatched major versions.
                    pattern: ^\d+\.\d+\.\d+$
                    type: string
                required:
                - name
                - version
                type: object
              capabilities:
                description: |-
                  Capabilities are operator-owned exclusively; no controller writes to
                  this field. Capabilities granted by a ModelRollout are never added
                  here — they are recorded in status.modelGrantedCapabilities[] and
                  folded into the computed status.capabilities[] union by the Capability
                  Controller.
                  MaxItems bounds CEL cost — see the Hardware field comment above.
                items:
                  description: ClassCapability is a capability advertised by every
                    robot of a class.
                  properties:
                    degradedPolicy:
                      description: |-
                        DegradedPolicy governs whether this capability may still be scheduled while
                        in Degraded status. When absent (or Schedulable=false) a Degraded instance is
                        treated as Inactive for scheduling. When Schedulable=true, the Scheduler may
                        satisfy a action's parametric constraints using the capability's currently
                        resolved (reduced) parameters — so a degraded capability serves lower-
                        constraint actions but is excluded from those it can no longer meet.
                      properties:
                        schedulable:
                          default: false
                          description: |-
                            Schedulable allows the Scheduler to satisfy parametric constraints with this
                            capability while it is Degraded, using its current (reduced) resolved
                            parameters. Default false: a Degraded capability is not schedulable.
                          type: boolean
                      required:
                      - schedulable
                      type: object
                    name:
                      description: Name is the capability identifier (e.g. "navigation.2d",
                        "estop.receive").
                      maxLength: 128
                      minLength: 1
                      type: string
                    parameters:
                      additionalProperties:
                        description: |-
                          CapabilityParameter is one parameter of a capability. Set exactly one of
                          SourceField (dynamic) or Value (static literal).
                        properties:
                          sourceField:
