{{- if .Values.rbac.create -}}
# ─────────────────────────────────────────────────────────────────────────────
# Controller-manager ClusterRole + binding.
#
# The rules below EQUAL config/rbac/role.yaml (controller-gen output from the
# +kubebuilder:rbac markers), rule for rule. Only the role, binding and
# ServiceAccount names and the namespace are templated.
#
# ENFORCED, not promised: `make helm-verify-sync` renders this chart and fails on
# any difference in either direction (hack/verify-helm-render.py). A chart that
# grants less than role.yaml is a controller that gets 403s on a Helm install and
# nowhere else; one that grants more is over-privileged on every install.
#
# After changing a marker: `make manifests`, then copy role.yaml's rules here.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "swarmada.fullname" . }}-manager-role
  labels:
    {{- include "swarmada.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - swarmada.io
  resources:
  - computeendpoints
  - fleetadapters
  - resultsinks
  - robotclasses
  - robotprobes
  - semanticevents
  - semanticeventsources
  - tasktriggers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - swarmada.io
  resources:
  - discoveredrobots
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - swarmada.io
  resources:
  - discoveredrobots/status
  - firmwarerollouts/status
  - fleetactions/status
  - fleetadapters/status
  - fleettasks/status
  - fleetzones/status
  - modelpolicies/status
  - modelrollouts/status
  - robotclasses/status
  - robotprobes/status
  - robots/status
  - semanticevents/status
  - semanticeventsources/status
  - swarmadaconfigs/status
  - tasktriggers/status
  - zonemaintenances/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - swarmada.io
  resources:
  - firmwarerollouts
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - swarmada.io
  resources:
  - fleetactions
  - robots
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - swarmada.io
  resources:
  - fleetactions/finalizers
  - fleettasks/finalizers
  - robots/finalizers
  - zonemaintenances/finalizers
  verbs:
  - update
- apiGroups:
  - swarmada.io
  resources:
  - fleettasks
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - swarmada.io
  resources:
  - fleetzones
  - modelpolicies
  - zonemaintenances
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - swarmada.io
  resources:
  - modelrollouts
  verbs:
  - create
  - get
  - list
  - patch
  - watch
- apiGroups:
  - swarmada.io
  resources:
  - swarmadaconfigs
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "swarmada.fullname" . }}-manager-rolebinding
  labels:
    {{- include "swarmada.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "swarmada.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "swarmada.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
