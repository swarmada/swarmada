# Controller-manager Deployment — mirrors config/manager/manager.yaml, with the
# image and flags driven by values. The image, args, ports, probes, resources, and
# security contexts all derive from the Dockerfile (/manager entrypoint) and the
# cmd/manager flag set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swarmada.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmada.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, never a rolling update: the old manager stops before the new one starts, so an
  # upgrade never runs a second manager process beside the leader. A single manager replica is
  # the only supported safety configuration (RFC-0001 #safety-robot-stop-table).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "swarmada.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swarmada.labels" . | nindent 8 }}
      {{- with .Values.manager.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "swarmada.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "swarmada.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --metrics-bind-address=:{{ .Values.manager.metricsPort }}
            - --health-probe-bind-address=:{{ .Values.manager.healthPort }}
            {{- if .Values.manager.leaderElect }}
            - --leader-elect
            - --leader-election-id={{ .Values.manager.leaderElectionID }}
            {{- end }}
            {{- if .Values.controlStream.enabled }}
            - --fleet-adapter-bind-address=:{{ .Values.controlStream.port }}
            # mTLS (ADR-0025). Without all three the manager does not serve ControlStream
            # (fail closed); templates/validate.yaml refuses to render without a source.
            - --fleet-adapter-tls-cert-file=/etc/controlstream-tls/tls.crt
            - --fleet-adapter-tls-key-file=/etc/controlstream-tls/tls.key
            - --fleet-adapter-client-ca-file=/etc/controlstream-tls/ca.crt
            {{- else }}
            # Empty disables the ControlStream gRPC server (cmd/manager).
            - --fleet-adapter-bind-address=
            {{- end }}
            {{- if .Values.modelWebhook.enabled }}
            - --model-webhook-bind-address=:{{ .Values.modelWebhook.port }}
            {{- else }}
            - --model-webhook-bind-address=
            {{- end }}
            {{- with .Values.manager.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # ENABLE_WEBHOOKS=false disables the admission webhook server (cmd/manager).
            - name: ENABLE_WEBHOOKS
              value: {{ ternary "true" "false" .Values.webhooks.enabled | quote }}
            # The manager reads its TDE recovery settings (spec.trafficDeconfliction.recovery.*)
            # from the SwarmadaConfig in its own namespace (cmd/manager). Set here from the
            # downward API, so manager.extraEnv need not set POD_NAMESPACE.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.manager.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.manager.healthPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.manager.metricsPort }}
              protocol: TCP
            {{- if .Values.webhooks.enabled }}
            - name: webhook-server
              containerPort: {{ .Values.webhooks.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.controlStream.enabled }}
            - name: controlstream
              containerPort: {{ .Values.controlStream.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.modelWebhook.enabled }}
            - name: model-webhook
              containerPort: {{ .Values.modelWebhook.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.manager.securityContext | nindent 12 }}
          {{- if or .Values.webhooks.enabled .Values.controlStream.enabled }}
          volumeMounts:
            {{- if .Values.webhooks.enabled }}
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
            {{- if .Values.controlStream.enabled }}
            - name: controlstream-tls
              mountPath: /etc/controlstream-tls
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.webhooks.enabled .Values.controlStream.enabled }}
      volumes:
        {{- if .Values.webhooks.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "swarmada.webhookCertSecret" . }}
            defaultMode: 420
        {{- end }}
        {{- if .Values.controlStream.enabled }}
        - name: controlstream-tls
          secret:
            secretName: {{ include "swarmada.controlStreamTLSSecret" . }}
            defaultMode: 420
        {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.manager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
