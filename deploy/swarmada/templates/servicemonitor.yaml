{{- if .Values.metrics.serviceMonitor.enabled -}}
# OPTIONAL — renders ONLY when metrics.serviceMonitor.enabled=true, so `helm
# template`/`helm install` stay clean on clusters WITHOUT the Prometheus Operator
# CRDs (monitoring.coreos.com). This does NOT install Prometheus; it points an
# EXISTING Prometheus Operator at Swarmada's metrics Service. Ensure your
# Prometheus's serviceMonitorSelector matches metrics.serviceMonitor.labels.
{{- if not .Values.metrics.service.enabled }}
{{- fail "metrics.serviceMonitor.enabled=true requires metrics.service.enabled=true (nothing to scrape)" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "swarmada.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmada.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "swarmada.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.metrics.serviceMonitor.path }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- with .Values.metrics.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
