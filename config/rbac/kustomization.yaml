apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Manager (controller) role, generated by controller-gen.
  - role.yaml
  # Binds the manager's ServiceAccount (config/manager/) to the role above.
  - manager_role_binding.yaml
  # The five built-in user/adapter roles (RFC-0001 §9.5.3), hand-authored.
  - swarmada_viewer_role.yaml
  - swarmada_operator_role.yaml
  - swarmada_fleet_manager_role.yaml
  - swarmada_admin_role.yaml
  - swarmada_robot_role.yaml
  # The Zone Controller edge node's service-account role (RFC-0001 §9.2.10).
  - swarmada_edge_role.yaml
