# Binds the swarmada-manager ServiceAccount (config/manager/manager.yaml,
# namespace "system") to the manager's own ClusterRole (role.yaml). Without
# this, the controller-manager container has no permissions at all and every
# reconciler fails at the first List/Watch call.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: swarmada-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: swarmada-manager-role
subjects:
  - kind: ServiceAccount
    name: swarmada-manager
    namespace: system
