# swarmada:viewer — read-only access to all Swarmada resources (RFC-0001 §9.5.3.1).
# Suitable for dashboards, monitoring, and read-only tooling. No write, no custom
# verbs, no audit access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: swarmada:viewer
  labels:
    app.kubernetes.io/part-of: swarmada
    swarmada.io/builtin-role: "true"
rules:
  - apiGroups: ["swarmada.io"]
    resources:
      - robots
      - discoveredrobots
      - robotclasses
      - fleetactions
      - fleettasks
      - fleetzones
      - zonemaintenances
      - robotprobes
      - firmwarerollouts
      - modelrollouts
      - modelpolicies
      - swarmadaconfigs
      - fleetadapters
    verbs: ["get", "list", "watch"]
