# swarmada:admin — full access including SwarmadaConfig, robots/status, CRD
# management, and the ONLY role granted estop-clear (RFC-0001 #security-role-definitions and #security-permission-matrix, the
# admin-only safety constraint). Suitable for the fleet platform team.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: swarmada:admin
  labels:
    app.kubernetes.io/part-of: swarmada
    swarmada.io/builtin-role: "true"
rules:
  # Full management of every Swarmada resource.
  - apiGroups: ["swarmada.io"]
    resources:
      - robots
      - discoveredrobots
      - robotclasses
      - fleetactions
      - fleettasks
      - fleetzones
      - zonemaintenances
      - robotprobes
      - firmwarerollouts
      - modelrollouts
      - modelpolicies
      - swarmadaconfigs
      - fleetadapters
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # robots/status writes (admin-only among users; the adapter writes its own).
  - apiGroups: ["swarmada.io"]
    resources: ["robots/status"]
    verbs: ["update", "patch"]
  # All custom verbs, including estop-clear — admin is the sole holder.
  - apiGroups: ["swarmada.io"]
    resources: ["discoveredrobots"]
    verbs: ["admit", "reject"]
  # policy-reset (RFC-0001 #security-permission-matrix): an operator override of an AUTOMATED decision — clearing a
  # FailedRepeatedly suspension so a ModelPolicy resumes evaluation. Scoped like admit/reject
  # rather than like estop-clear: it is a model-quality call, not a safety one, so it does not
  # need to be admin-only.
  - apiGroups: ["swarmada.io"]
    resources: ["modelpolicies"]
    verbs: ["policy-reset"]
  # rollout-resume (ADR-0041): an operator override of an AUTOMATED safety halt — releasing a
  # rollout that pauseOnError stopped. It EXCLUDES the robots that failed rather than retrying
  # them, so it abandons work rather than repeating it; scoped like policy-reset because it is
  # a fleet-update call, not a safety-stop one.
  - apiGroups: ["swarmada.io"]
    resources: ["firmwarerollouts", "modelrollouts"]
    verbs: ["rollout-resume"]
  - apiGroups: ["swarmada.io"]
    resources: ["fleetactions"]
    verbs: ["cancel"]
  - apiGroups: ["swarmada.io"]
    resources: ["fleettasks"]
    verbs: ["append", "cancel", "activate"]
  # Estop at every scope: robots (robot), fleetzones (zone), swarmadaconfigs (namespace —
  # the webhook authorizes a namespace estop against the SwarmadaConfig that carries it).
  - apiGroups: ["swarmada.io"]
    resources: ["fleetzones", "robots", "swarmadaconfigs"]
    verbs: ["estop-trigger", "estop-clear"]
  # Safety audit log: read + export + verify.
  - apiGroups: ["swarmada.io"]
    resources: ["safetyauditlogs"]
    verbs: ["read", "export", "verify"]
  # CRD management: read any CRD; write only Swarmada's own, by name. No create and no
  # deletecollection, because RBAC cannot narrow either by name: the identity that installs
  # the chart installs and upgrades the CRDs. The names are every CRD in config/crd/bases.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - artifactstores.swarmada.io
      - computeendpoints.swarmada.io
      - computeworkloadtemplates.swarmada.io
      - discoveredrobots.swarmada.io
      - edgenodes.swarmada.io
      - firmwarerollouts.swarmada.io
      - fleetactions.swarmada.io
      - fleetadapters.swarmada.io
      - fleettasks.swarmada.io
      - fleetzones.swarmada.io
      - modelpolicies.swarmada.io
      - modelrollouts.swarmada.io
      - resultsinks.swarmada.io
      - robotclasses.swarmada.io
      - robotprobes.swarmada.io
      - robots.swarmada.io
      - semanticevents.swarmada.io
      - semanticeventsources.swarmada.io
      - swarmadaconfigs.swarmada.io
      - tasktriggers.swarmada.io
      - zonemaintenances.swarmada.io
    verbs: ["update", "patch", "delete"]
  # Core Events, read only: `swarmctl describe` and `kubectl describe` list an object's Events,
  # and without this they show "<unavailable: forbidden>" where a Warning would be.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
