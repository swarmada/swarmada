# The generated admission-webhook configurations. NOT referenced by config/default, which
# cannot provision serving certs; an overlay that can (config/controlstream-tls) pulls this
# in and supplies the Certificate + caBundle injection.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifests.yaml
