apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DEMO ONLY — the status-projected quickstart path
# (examples/warehouse-quickstart/run.sh with LIVE=0, and CI's
# `make quickstart-test`). Builds on config/default and turns the ControlStream
# server OFF; see manager-no-controlstream-patch.yaml for why that is required
# rather than merely tidy.
#
# Sibling overlay: config/overlays/quickstart-dev is the LIVE path, which runs a
# real sim_adapter.py and therefore KEEPS ControlStream enabled.
#
# `make deploy` (config/default) is untouched by this and still serves
# ControlStream — that is the right default for a developer cluster a real
# adapter will dial into.

resources:
  - ../../default

patches:
  - path: manager-no-controlstream-patch.yaml
