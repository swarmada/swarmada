# Third of three per-robot adapter identities for demo-ab-live — see
# adapter-client-cert-2.yaml for why a distinct SAN/FleetAdapter is required
# per concurrently-live robot.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sim-fleet-adapter-3-client
  namespace: system
spec:
  secretName: sim-fleet-adapter-3-client-tls
  duration: 2160h # 90d
  privateKey:
    algorithm: ECDSA
    size: 256
  commonName: sim-fleet-adapter-3
  dnsNames:
    - sim-fleet-adapter-3.warehouse-a.svc.cluster.local
  usages:
    - client auth
  issuerRef:
    name: controlstream-ca-issuer
    kind: Issuer
