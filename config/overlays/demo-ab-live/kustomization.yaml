# DEMO overlay for examples/demo-ab-live/run.sh — the canonical, fully-honest
# Demo A/B (UC-2.1/UC-2.2, Layered Demo Plan backlog #1): every robot in the
# sample fleet is driven by its own real sim_adapter.py process over a real,
# mutually-authenticated ControlStream. No status field in this path is ever
# written by kubectl.
#
# Just ../quickstart-mtls (CA, Issuer, server cert, the manager mTLS patch,
# and the FIRST adapter identity, sim-fleet-adapter/sim-fleet-adapter-client)
# plus two more client-cert identities, sim-fleet-adapter-2 and -3, one per
# additional robot that needs to be live at once. See
# adapter-client-cert-2.yaml for why one shared identity can't carry more than
# one concurrent live robot.
resources:
  - ../quickstart-mtls
  - adapter-client-cert-2.yaml
  - adapter-client-cert-3.yaml
