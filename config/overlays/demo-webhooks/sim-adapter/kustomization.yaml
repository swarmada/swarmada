#
# The reference simulation adapter, run BY THE CLUSTER.
#
# With admission webhooks on, vrobot.swarmada.io admits a Robot only when its
# FleetAdapter is Connected with conformance Passed (RFC-0001
# #fleetadapter-admission-gating), and an adapter is Connected only while a live
# process holds a ControlStream open. This directory makes that process a
# Deployment, so applying the overlay is what brings the adapter up: nobody starts
# it, port-forwards to it or copies certificates out for it.
#
#   adapter.yaml        ServiceAccount + Deployment in `system`, beside the
#                       Secret cert-manager issues from ../adapter-client-certs.yaml
#   fleetadapter.yaml   the demo namespace, the FleetAdapter object the process
#                       connects as, and its digest-pinned conformance report
#
# Image: swarmada-sim-adapter:dev, built from Dockerfile.sim-adapter at the
# repository root and loaded into the cluster (kind load docker-image). It is not
# pulled from a registry, hence imagePullPolicy: IfNotPresent.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - fleetadapter.yaml
  - adapter.yaml

# The conformance report fleetadapter.yaml pins by digest; see the note there.
configMapGenerator:
  - name: sim-fleet-adapter-conformance
    namespace: warehouse-a
    files:
      - report.json=conformance-report.json
    options:
      disableNameSuffixHash: true
