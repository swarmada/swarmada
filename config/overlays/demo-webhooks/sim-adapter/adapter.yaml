#
# The sim adapter process, as a Deployment.
#
# WHY NAMESPACE `system` AND NOT warehouse-a. A pod can mount only Secrets in its own
# namespace, and cert-manager issues the client identity into `system`
# (../adapter-client-certs.yaml, Secret sim-fleet-adapter-client-tls). The adapter's
# logical namespace is not where its pod runs: it is the one in its certificate SAN,
# and it declares the same one in AdapterHello (--namespace), which the control plane
# checks against the certificate.
#
# RBAC: NONE, deliberately. The adapter never calls the Kubernetes API — it speaks
# only the fleet_adapter.v1 gRPC contract to the ControlStream, which authenticates
# it by the mTLS client certificate, not by a Kubernetes identity. So its
# ServiceAccount has no Role or RoleBinding, and the token is not mounted
# (automountServiceAccountToken: false): a credential the process never uses is one
# it cannot leak. The kubelet, not the pod, reads the Secret volume, so mounting the
# certificate needs no `get secrets` grant either.
#
# ONE REPLICA, Recreate. The control plane keys a live ControlStream by
# "<namespace>/<adapter-name>" (internal/command/dispatcher.go), so two processes
# presenting one identity overwrite each other. Recreate stops the old pod before the
# new one starts, so a rollout never has two.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sim-fleet-adapter
  namespace: system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-fleet-adapter
  namespace: system
  labels:
    app.kubernetes.io/name: sim-fleet-adapter
    app.kubernetes.io/component: fleet-adapter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sim-fleet-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sim-fleet-adapter
        app.kubernetes.io/component: fleet-adapter
    spec:
      serviceAccountName: sim-fleet-adapter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The Secret volume's files are group-owned by fsGroup, so mode 0440 is
        # readable by this uid and by nobody else in the pod.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: swarmada-sim-adapter:dev
          imagePullPolicy: IfNotPresent
          args:
            # In-cluster: dial the ControlStream Service by the name its server
            # certificate carries (../../../controlstream-tls/certificate.yaml), so
            # no --tls-server-name override and no port-forward.
            - --endpoint=swarmada-controlstream.system.svc:9445
            - --namespace=warehouse-a
            - --robot-id=sim-robot-001
            - --zone=warehouse-a
            - --vendor=simulation
            - --tls-ca=/etc/swarmada/tls/ca.crt
            - --tls-cert=/etc/swarmada/tls/tls.crt
            - --tls-key=/etc/swarmada/tls/tls.key
            # The root filesystem is read-only and there is no /tmp, so the map that
            # `Custom explore-floor` saves goes to this emptyDir. No store serves it: the
            # map lives as long as the pod.
            - --artifact-dir=/var/lib/sim-adapter/artifacts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: client-tls
              mountPath: /etc/swarmada/tls
              readOnly: true
            - name: artifacts
              mountPath: /var/lib/sim-adapter/artifacts
      volumes:
        - name: artifacts
          emptyDir:
            sizeLimit: 64Mi
        - name: client-tls
          secret:
            secretName: sim-fleet-adapter-client-tls
            defaultMode: 0440
