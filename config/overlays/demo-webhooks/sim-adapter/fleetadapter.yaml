#
# The object side of the in-cluster sim adapter: the namespace its robot lives in and
# the FleetAdapter it connects as. The conformance report that FleetAdapter pins is the
# ConfigMap kustomization.yaml generates from conformance-report.json.
#
# NAME AND NAMESPACE ARE NOT FREE CHOICES. The control plane takes the adapter's name
# and namespace from its client certificate's SAN, <adapter>.<namespace>.svc.cluster.local
# (RFC-0001 #security-fleet-adapter-authentication-robot-identity). The certificate
# ../adapter-client-certs.yaml issues for this process carries
# sim-fleet-adapter.warehouse-a.svc.cluster.local, so this object must be
# FleetAdapter warehouse-a/sim-fleet-adapter or the process's heartbeats land nowhere.
#
# CONFORMANCE. The report is UNSIGNED. It reaches Passed only in a namespace whose
# SwarmadaConfig sets spec.signing.requireSignatureVerification: false — which
# config/samples/robotclass_defaulting_demo.yaml does. Until such a SwarmadaConfig
# exists the controller reports conformance Failed and says why (fail closed, the
# schema default), and a namespace that enforces signing keeps it Failed. That is
# deliberate: this overlay does not decide the namespace's signing posture, and
# vrobot.swarmada.io keeps refusing Robots until conformance is Passed. The
# controller re-verifies on every heartbeat interval while the adapter is Connected,
# so a posture change is picked up without touching this object.
#
# THE REPORT is one the conformance harness wrote, never a verdict typed here:
# conformance-report.json is the recorded harness report for the simulation adapter,
# written by
#   SIM_CONFORMANCE_REPORT=recorded hack/sim-conformance-report.sh \
#     config/overlays/demo-webhooks/sim-adapter/conformance-report.json
# (a byte copy of test/samples/testdata/recorded-sim-adapter-report.json, the recorded
# harness report the repository publishes). The digest below is sha256 over
# those exact bytes; change one byte and the controller reports "digest mismatch".
# Recompute with  shasum -a 256 < conformance-report.json. test/samples fails if the
# copy, the digest or the report's contract version stops agreeing with the control plane.
apiVersion: v1
kind: Namespace
metadata:
  name: warehouse-a
---
apiVersion: swarmada.io/v1
kind: FleetAdapter
metadata:
  name: sim-fleet-adapter
  namespace: warehouse-a
spec:
  vendor: simulation
  # spec.endpoint is left unset: it is informational only (the ControlStream is
  # adapter-initiated and the control plane never dials it), and this process has
  # no listener to name. The process is Deployment system/sim-fleet-adapter.
  simulated: true
  servesRobotClasses:
    - amr-standard
  heartbeatIntervalSeconds: 10
  conformanceReport:
    suiteVersion: "C0-C19"
    configMapRef: sim-fleet-adapter-conformance
    digest: "sha256:6012874d3cabd497cfaf1050033a1f06de0059b80f295fce186b77bf8f5e1b26"
