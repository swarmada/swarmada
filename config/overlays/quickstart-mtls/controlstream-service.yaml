# Exposes the manager's ControlStream port (--fleet-adapter-bind-address,
# default :9443) as a Service, so a local demo adapter — or, in principle, an
# in-cluster one — can reach it by name instead of a pod-direct port-forward.
# Not part of config/default: production ControlStream exposure is a
# deployment concern tied to the mTLS work in backlog §F, not decided here.

apiVersion: v1
kind: Service
metadata:
  name: swarmada-controlstream
  namespace: system
  labels:
    control-plane: controller-manager
spec:
  selector:
    control-plane: controller-manager
  ports:
    - name: fleet-adapter
      port: 9443
      targetPort: 9443
      protocol: TCP
