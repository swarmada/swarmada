#
# Strategic-merge patch: `args` on a Container has no merge key, so this repeats
# config/manager/manager.yaml's base three flags and appends the TLS trio.
#
# Unlike config/controlstream-tls's patch this keeps ENABLE_WEBHOOKS=false, so it
# needs no webhook serving certs — one less thing to provision on a throwaway kind
# cluster. ControlStream stays on the manager's default port, 9445, the same port
# as every other overlay and the chart.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmada-controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: manager
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect
            # Repeated from config/manager/manager.yaml: `args` on a Container has no
            # merge key, so a strategic-merge patch replaces the whole list and would
            # otherwise silently drop the durable audit sink. The volume and
            # mount DO merge (by name / mountPath) and are not repeated.
            - --audit-log-file=/var/log/swarmada/audit.jsonl
            - --fleet-adapter-tls-cert-file=/etc/controlstream-tls/tls.crt
            - --fleet-adapter-tls-key-file=/etc/controlstream-tls/tls.key
            - --fleet-adapter-client-ca-file=/etc/controlstream-tls/ca.crt
            # No --fleet-adapter-insecure-authz: the manager refuses it beside the
            # three TLS flags above. Per-robot authorization stays on. The sample
            # Robots carry robotClass simbot-v1 (config/samples/demo_a.yaml) and the
            # runners' FleetAdapter lists it in spec.servesRobotClasses, which is the
            # class check the authorizer makes on every robot-scoped message.
          env:
            - name: ENABLE_WEBHOOKS
              value: "false"
          volumeMounts:
            - name: controlstream-tls
              mountPath: /etc/controlstream-tls
              readOnly: true
      volumes:
        - name: controlstream-tls
          secret:
            secretName: controlstream-server-tls
