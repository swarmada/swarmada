#
# Strategic merge patch: the `args` field on a corev1.Container has no merge
# key, so a patch that sets `args` replaces the whole list — this repeats
# config/manager/manager.yaml's base three flags and appends the dev-only
# fourth. If the base args ever change, update this list to match.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmada-controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: manager
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect
            - --fleet-adapter-insecure-authz=true
