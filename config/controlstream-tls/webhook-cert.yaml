# Admission-webhook serving material.
#
# config/default deliberately ships without config/webhook/ because the webhooks need real
# serving certs that it cannot provision. THIS overlay already requires cert-manager for the
# ControlStream server cert, so that blocker does not apply here — which is why the webhooks
# are enabled at this layer and not in the base.
#
# Without them the control plane runs with NO admission control and NO defaulting: the
# leaf-zone check, robot-id uniqueness, charging.dockName resolution and the FleetAdapter
# admission gate (§6.6) are all absent, and — the failure that actually shows up first —
# Robot.metadata.annotations["swarmada.io/robot-id"] is never defaulted, so telemetry cannot
# be resolved to a Robot (ADR-0028) and is silently dropped.

apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: system
  labels:
    control-plane: controller-manager
spec:
  selector:
    control-plane: controller-manager
  ports:
    - name: webhook
      port: 443
      # controller-runtime's webhook server listens on 9443 by default. ControlStream was
      # moved off that port (manager-mtls-patch.yaml) so the two can coexist in one pod.
      targetPort: 9443
      protocol: TCP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webhook-serving-cert
  namespace: system
spec:
  secretName: webhook-server-cert
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
    - digital signature
    - key encipherment
  dnsNames:
    - webhook-service.system.svc
    - webhook-service.system.svc.cluster.local
  # Reuses the ControlStream CA rather than minting a second trust root: one CA per cluster
  # keeps the material an operator has to rotate, and reason about, to one.
  issuerRef:
    name: controlstream-ca-issuer
    kind: Issuer
