#
# Strategic-merge patch: mount the cert-manager-issued server keypair + CA and set
# the three ControlStream mTLS flags (ADR-0025). `args` on a Container has no merge
# key, so setting it replaces the whole list — this repeats config/manager's base
# three flags and appends the TLS trio. If the base args change, update this list.
# volumeMounts/volumes DO merge by name, so they add to the base pod spec.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmada-controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: manager
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect
            # ControlStream moves OFF 9443. controller-runtime's webhook server takes 9443 by
            # default and is not configurable from here, so with the webhooks enabled the two
            # would race for the same port inside one pod and whichever bound second would
            # fail. The Service still publishes 9443 and forwards to 9445, so the documented
            # adapter endpoint (swarmada-controlstream.system.svc:9443) is unchanged and no
            # adapter, chart or runbook needs editing.
            #
            # PORT MAP inside this pod — every one of these is already claimed, so a new
            # listener must not reuse them:
            #   8080  metrics            (--metrics-bind-address)
            #   8081  health probes      (--health-probe-bind-address)
            #   9443  admission webhooks (controller-runtime default; not settable here)
            #   9444  ModelPolicy training-completion webhook (--model-webhook-bind-address)
            #   9445  ControlStream      (this flag)
            - --fleet-adapter-bind-address=:9445
            - --fleet-adapter-tls-cert-file=/etc/controlstream-tls/tls.crt
            - --fleet-adapter-tls-key-file=/etc/controlstream-tls/tls.key
            - --fleet-adapter-client-ca-file=/etc/controlstream-tls/ca.crt
          env:
            # config/manager sets this false because the base overlay cannot provision serving
            # certs. This overlay can, so admission control and defaulting are turned on.
            - name: ENABLE_WEBHOOKS
              value: "true"
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
            - containerPort: 9445
              name: controlstream
              protocol: TCP
          volumeMounts:
            - name: controlstream-tls
              mountPath: /etc/controlstream-tls
              readOnly: true
            # controller-runtime's default certDir; it reads tls.crt/tls.key from here.
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: controlstream-tls
          secret:
            secretName: controlstream-server-tls
        - name: webhook-certs
          secret:
            secretName: webhook-server-cert
