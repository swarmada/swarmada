#
# The ControlStream Service. Its name is the trust anchor for the server
# certificate: the cert's SAN is swarmada-controlstream.<ns>.svc[.cluster.local]
# (see certificate.yaml), so adapters dialing this name get a verified channel.
# The production counterpart to config/overlays/quickstart-dev's dev Service.

apiVersion: v1
kind: Service
metadata:
  name: swarmada-controlstream
  namespace: system
  labels:
    control-plane: controller-manager
spec:
  selector:
    control-plane: controller-manager
  ports:
    - name: fleet-adapter
      port: 9443
      # The container listens on 9445 (see manager-mtls-patch.yaml); the published port stays
      # 9443 so the adapter endpoint in every chart and runbook keeps working unchanged.
      targetPort: 9445
      protocol: TCP
