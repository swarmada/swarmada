---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: robots.swarmada.io
spec:
  group: swarmada.io
  names:
    kind: Robot
    listKind: RobotList
    plural: robots
    shortNames:
    - rob
    singular: robot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .status.batteryPercent
      name: Battery
      type: integer
    - jsonPath: .status.assignedAction
      name: Action
      type: string
    - jsonPath: .spec.robotClass
      name: Class
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Robot is the Schema for the robots API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RobotSpec defines the desired state of a Robot (RFC-0001 §Robot Schema).
              When RobotClass is set, Hardware / InstalledModels / Capabilities entries
              declared here are merged union-by-name over the class's inherited entries
              (a same-named entry fully overrides the class's); Constraints and Charging
              are whole-value overrides. See RobotClassSpec for the merge semantics.

              Both rules are guarded with !has(self.capabilities) since capabilities is
              optional — a Robot that omits it entirely (the common case; capabilities
              are frequently supplied only via RobotClass/ModelRollout) must not fail CEL
              evaluation with "no such key: capabilities".
            properties:
              adapter:
                description: Adapter is the Fleet Adapter binding for this robot.
                properties:
                  name:
                    description: Name must match an installed FleetAdapter resource
                      in this namespace.
                    minLength: 1
                    type: string
                  version:
                    description: |-
                      Version is used by the OTA/Model Update Manager to validate compatibility
                      before pushing firmware; admission rejects mismatched major versions.
                    pattern: ^\d+\.\d+\.\d+$
                    type: string
                required:
                - name
                - version
                type: object
              capabilities:
                description: |-
                  Capabilities are operator-owned exclusively; no controller writes to
                  this field. Capabilities granted by a ModelRollout are never added
                  here — they are recorded in status.modelGrantedCapabilities[] and
                  folded into the computed status.capabilities[] union by the Capability
                  Controller.
                  MaxItems bounds CEL cost — see the Hardware field comment above.
                items:
                  description: ClassCapability is a capability advertised by every
                    robot of a class.
                  properties:
                    degradedPolicy:
                      description: |-
                        DegradedPolicy governs whether this capability may still be scheduled while
                        in Degraded status. When absent (or Schedulable=false) a Degraded instance is
                        treated as Inactive for scheduling. When Schedulable=true, the Scheduler may
                        satisfy a action's parametric constraints using the capability's currently
                        resolved (reduced) parameters — so a degraded capability serves lower-
                        constraint actions but is excluded from those it can no longer meet.
                      properties:
                        schedulable:
                          default: false
                          description: |-
                            Schedulable allows the Scheduler to satisfy parametric constraints with this
                            capability while it is Degraded, using its current (reduced) resolved
                            parameters. Default false: a Degraded capability is not schedulable.
                          type: boolean
                      required:
                      - schedulable
                      type: object
                    name:
                      description: Name is the capability identifier (e.g. "navigation.2d",
                        "estop.receive").
                      maxLength: 128
                      minLength: 1
                      type: string
                    parameters:
                      additionalProperties:
                        description: |-
                          CapabilityParameter is one parameter of a capability. Set exactly one of
                          SourceField (dynamic) or Value (static literal).
                        properties:
                          sourceField:
                            description: |-
                              SourceField is a dotted path into the resolved spec, e.g.
                              "hardware[load-platform].spec.maxPayloadKg".
                            type: string
                          value:
                            description: Value is a static literal value for the parameter.
                            type: string
                        type: object
                      description: |-
                        Parameters carries capability-specific parameters. A parameter is resolved
                        either dynamically from a hardware field (sourceField) — so a per-robot
                        hardware override is reflected automatically — or as a static literal.
                      type: object
                    pauseable:
                      default: true
                      description: |-
                        Pauseable reports whether the scheduler may suspend this capability. Safety
                        and monitoring capabilities (e.g. estop.receive, health.heartbeat) MUST be
                        false and are never paused.
                      type: boolean
                    providingModel:
                      description: ProvidingModel names the ClassModel backing a model-driven
                        capability.
                      maxLength: 128
                      type: string
                    requiredHardware:
                      description: |-
                        RequiredHardware lists component names that must be Healthy for this
                        capability to be Active. An empty list means no hardware dependency.
                        MaxItems bounds CEL cost (see Robot.spec.hardware's comment).
                      items:
                        type: string
                      maxItems: 32
                      type: array
                      x-kubernetes-list-type: set
                    type:
                      description: Type is how the capability is provided.
                      enum:
                      - hardware-native
                      - model-driven
                      - manual
                      type: string
                  required:
                  - name
                  - pauseable
                  - type
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              charging:
                description: Charging is this robot's charging dock assignment and
                  thresholds.
                properties:
                  dockName:
                    description: |-
                      DockName names a ChargingDock shared resource declared in this robot's
                      FleetZone or any ancestor zone's sharedResources[]. Cross-resource, so
                      validated by the admission webhook, not by CEL.
                    type: string
                  minBatteryPctToCharge:
                    description: |-
                      MinBatteryPctToCharge is the battery level below which the robot
                      initiates autonomous docking.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  targetBatteryPct:
                    description: |-
                      TargetBatteryPct is the level at which the robot leaves the dock; it
                      MUST be greater than MinBatteryPctToCharge.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: targetBatteryPct must be greater than minBatteryPctToCharge
                  rule: '!has(self.minBatteryPctToCharge) || !has(self.targetBatteryPct)
                    || self.targetBatteryPct > self.minBatteryPctToCharge'
              constraints:
                description: |-
                  Constraints are operational limits the Scheduler uses as filter
                  predicates (e.g. a action requiring more than MaxPayloadKg is never
                  assigned here).
                properties:
                  maxPayloadKg:
                    description: MaxPayloadKg caps the load the robot will accept,
                      in kilograms.
                    minimum: 0
                    type: number
                  maxSpeedMs:
                    description: |-
                      MaxSpeedMs is the maximum commanded speed in metres per second; the Fleet
                      Adapter enforces this limit.
                    minimum: 0
                    type: number
                  minBatteryPctForAction:
                    description: |-
                      MinBatteryPctForAction is the battery floor below which the robot refuses new
                      action assignments.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                type: object
              hardware:
                description: |-
                  Hardware is the physical component inventory declared by the operator —
                  NOT runtime state. Presence here does not imply the component is
                  healthy; health lives in status.hardware[].
                  MaxItems bounds the CEL cost of this spec's cross-field
                  x-kubernetes-validations rules (capabilities[].requiredHardware /
                  providingModel cross-references) — without it the API server's CEL
                  cost estimator assumes an unbounded array and rejects the CRD at
                  apply time ("estimated rule cost exceeds budget"), since those rules
                  are quadratic in hardware/capabilities/installedModels size.
                items:
                  description: |-
                    HardwareComponent declares one physical component. Type-specific attributes are
                    optional and interpreted according to Type. They are pointers so that "unset"
                    is distinguishable from a real zero (a LoadPlatform with maxPayloadKg unset is
                    "unknown", not "0 kg") — the same explicit-presence discipline applied to the
                    Fleet Adapter telemetry proto.
                  properties:
                    channels:
                      description: Channels is the number of audio input channels
                        (Microphone).
                      format: int32
                      type: integer
                    customType:
                      description: CustomType names the component kind when Type is
                        Custom (e.g. "SafetyBus").
                      type: string
                    degreesOfFreedom:
                      description: DegreesOfFreedom is the number of articulated joints
                        (Arm).
                      format: int32
                      type: integer
                    depthCapable:
                      description: DepthCapable reports whether a Camera provides
                        a depth channel.
                      type: boolean
                    frameRateFps:
                      description: FrameRateFps is the sensor frame rate (Camera).
                      format: int32
                      type: integer
                    horizontalFovDeg:
                      description: HorizontalFovDeg is the horizontal field of view
                        in degrees.
                      type: number
                    maxGripForceN:
                      description: MaxGripForceN is the maximum grip force in newtons
                        (Gripper).
                      type: number
                    maxPayloadKg:
                      description: MaxPayloadKg is the rated payload for a LoadPlatform
                        / Arm in kilograms.
                      type: number
                    model:
                      description: Model is the component's manufacturer/model string
                        (e.g. "SICK TIM551").
                      type: string
                    name:
                      description: Name uniquely identifies this component within
                        the inventory (merge key).
                      maxLength: 128
                      minLength: 1
                      type: string
                    platformLengthMm:
                      description: PlatformLengthMm is the load platform length in
                        millimetres.
                      format: int32
                      type: integer
                    platformWidthMm:
                      description: PlatformWidthMm is the load platform width in millimetres.
                      format: int32
                      type: integer
                    rangeM:
                      description: RangeM is the sensing range in metres (Lidar /
                        depth Camera).
                      type: number
                    reachMm:
                      description: ReachMm is the maximum reach from base in millimetres
                        (Arm).
                      format: int32
                      type: integer
                    resolutionH:
                      description: ResolutionH is the horizontal resolution in pixels
                        (Thermal / Display).
                      format: int32
                      type: integer
                    resolutionMp:
                      description: ResolutionMp is the sensor resolution in megapixels
                        (Camera).
                      type: number
                    resolutionV:
                      description: ResolutionV is the vertical resolution in pixels
                        (Thermal / Display).
                      format: int32
                      type: integer
                    sampleRateHz:
                      description: SampleRateHz is the audio sample rate in Hz (Microphone).
                      format: int32
                      type: integer
                    strokeMm:
                      description: StrokeMm is the maximum jaw opening in millimetres
                        (Gripper).
                      format: int32
                      type: integer
                    tempRangeMaxC:
                      description: TempRangeMaxC is the maximum sensing temperature
                        in Celsius (Thermal).
                      format: int32
                      type: integer
                    tempRangeMinC:
                      description: TempRangeMinC is the minimum sensing temperature
                        in Celsius (Thermal).
                      format: int32
                      type: integer
                    touchCapable:
                      description: TouchCapable reports whether a Display accepts
                        touch input.
                      type: boolean
                    type:
                      description: Type classifies the component.
                      enum:
                      - Lidar
                      - Camera
                      - Gripper
                      - LoadPlatform
                      - Arm
                      - Thermal
                      - Microphone
                      - Display
                      - Custom
                      type: string
                  required:
                  - name
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: customType is required when type is Custom
                    rule: self.type != 'Custom' || (has(self.customType) && size(self.customType)
                      > 0)
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              installedModels:
                description: |-
                  InstalledModels declares inference model packages deployed to this
                  robot's onboard compute, overriding any RobotClass defaultModels[] of
                  the same name. Runtime status (Active/Updating/Failed/Inactive) lives
                  exclusively in status.installedModels[], written by the Robot Agent —
                  mirroring spec.containers[] / status.containerStatuses[].
                  MaxItems bounds CEL cost — see the Hardware field comment above.
                items:
                  description: ClassModel is a default inference model installed on
                    robots of a class.
                  properties:
                    grantsCapabilities:
                      description: |-
                        GrantsCapabilities lists capabilities unlocked when the model is Active.
                        MaxItems bounds CEL cost (see Robot.spec.hardware's comment).
                      items:
                        type: string
                      maxItems: 32
                      type: array
                      x-kubernetes-list-type: set
                    modelUri:
                      description: |-
                        ModelURI is where the Robot Agent fetches the model artifact
                        (e.g. "oci://registry.swarmada.io/models/item-recognition:3.2.1").
                      minLength: 1
                      type: string
                    name:
                      description: |-
                        Name is the logical model name; it must match
                        Robot.spec.installedModels[*].name after a ModelRollout completes.
                      maxLength: 128
                      minLength: 1
                      type: string
                    requiredHardware:
                      description: |-
                        RequiredHardware lists component names that must be Healthy for the model to
                        run; a degraded dependency moves the model — and the capabilities it grants
                        — Inactive. MaxItems bounds CEL cost (see Robot.spec.hardware's comment).
                      items:
                        type: string
                      maxItems: 32
                      type: array
                      x-kubernetes-list-type: set
                    version:
                      description: Version is the model version (semver).
                      pattern: ^\d+\.\d+\.\d+$
                      type: string
                  required:
                  - modelUri
                  - name
                  - version
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              maintenanceWindow:
                description: MaintenanceWindow is this robot's planned recurring maintenance
                  window.
                properties:
                  dayOfWeek:
                    description: DayOfWeek the window recurs on.
                    enum:
                    - Monday
                    - Tuesday
                    - Wednesday
                    - Thursday
                    - Friday
                    - Saturday
                    - Sunday
                    type: string
                  durationMinutes:
                    description: DurationMinutes is how long the window stays open.
                    format: int32
                    maximum: 480
                    minimum: 15
                    type: integer
                  startHour:
                    description: StartHour is the hour (24h UTC) at which the window
                      opens.
                    format: int32
                    maximum: 23
                    minimum: 0
                    type: integer
                required:
                - dayOfWeek
                - durationMinutes
                - startHour
                type: object
              manufacturer:
                description: Manufacturer is the robot vendor (e.g. "acme-robotics",
                  "borealis").
                minLength: 1
                type: string
              maxIdleIntervalSeconds:
                description: |-
                  MaxIdleIntervalSeconds is the maximum time a stationary robot may go without
                  sending a position frame even if MotionThresholdMeters has not been exceeded,
                  bounding staleness of last-known position. Unset here it is inherited from the
                  class's defaultTelemetry.
                format: int32
                maximum: 300
                minimum: 1
                type: integer
              model:
                description: Model is the hardware model identifier (e.g. "acme-picker",
                  "borealis-250").
                minLength: 1
                type: string
              motionThresholdMeters:
                description: |-
                  MotionThresholdMeters is the minimum position change (in the units declared by
                  SwarmadaConfig.spec.coordinateSystem) before the Fleet Adapter sends a new
                  position frame. A stationary robot may skip position frames down to the ceiling
                  imposed by MaxIdleIntervalSeconds. Offline detection relies on heartbeat, not
                  position frames, and is unaffected. Unset here it is inherited from the class's
                  defaultTelemetry.
                minimum: 0
                type: number
              robotClass:
                description: |-
                  RobotClass is the name of a RobotClass in this namespace whose hardware
                  inventory, default models, base capabilities, and operational defaults
                  are merged into this Robot's spec at admission. When set, the admission
                  gate additionally requires a Connected, conformance-passed FleetAdapter
                  that serves this class. Optional: a Robot may instead describe its
                  hardware and capabilities inline.
                type: string
              telemetryIntervalSeconds:
                description: |-
                  TelemetryIntervalSeconds is the telemetry reporting interval — the MAXIMUM
                  interval between TelemetryPayload frames and the basis for Offline detection
                  (3x this value with no heartbeat). Lower values increase control-plane load;
                  5s is the recommended production default. Use 1s only for development.

                  No schema default: unset here it is inherited from the robot's RobotClass
                  (spec.defaultTelemetry.telemetryIntervalSeconds) by the RobotDefaulter merge —
                  the same inheritance model as adapter/constraints/charging.
                format: int32
                maximum: 30
                minimum: 1
                type: integer
              zone:
                description: |-
                  Zone is the leaf FleetZone this robot is assigned to operate in. MUST
                  reference a FleetZone with no children; admission rejects a non-leaf
                  reference (cross-resource, enforced by the admission webhook). The Zone
                  Controller derives status.currentZone from telemetry and may differ
                  from this field if the robot has physically moved.
                minLength: 1
                type: string
            required:
            - adapter
            - manufacturer
            - model
            - zone
            type: object
            x-kubernetes-validations:
            - message: a capability's requiredHardware must reference a component
                declared in spec.hardware
              rule: '!has(self.capabilities) || self.capabilities.all(c, !has(c.requiredHardware)
                || c.requiredHardware.all(h, self.hardware.exists(hw, hw.name == h)))'
            - message: a capability's providingModel must reference a model declared
                in spec.installedModels
              rule: '!has(self.capabilities) || self.capabilities.all(c, !has(c.providingModel)
                || self.installedModels.exists(m, m.name == c.providingModel))'
          status:
            description: |-
              RobotStatus describes the observed state of a Robot (RFC-0001 §Robot
              Schema). Written exclusively by controllers via the /status subresource;
              operators MUST NOT write to status fields directly.
            properties:
              assignedAction:
                description: |-
                  AssignedAction is the name of the FleetAction currently assigned to this
                  robot, if any.
                type: string
              batteryPercent:
                description: |-
                  BatteryPercent is the last reported battery charge (0–100). It is a COARSE,
                  throttled projection, updated only when the charge crosses a configured
                  bucket boundary — never on every telemetry tick (RA-1). For continuous
                  battery history, query the telemetry TSDB, not this field.
                format: int32
                type: integer
              capabilities:
                description: |-
                  Capabilities is the computed union of spec-declared and model-granted
                  capabilities (see the Capability Derivation Truth Table) — the single
                  authoritative set the Scheduler reads. No controller ever writes
                  spec.capabilities[]; this field is the only one the Scheduler consults.
                items:
                  description: |-
                    CapabilityStatusEntry is the computed runtime status of one capability,
                    from either spec.capabilities[] or a model-granted synthetic entry (see the
                    Capability Derivation Truth Table).
                  properties:
                    degradedSchedulable:
                      description: |-
                        DegradedSchedulable reflects the capability's degradedPolicy: when true, the
                        Scheduler may satisfy parametric constraints with this capability while it is
                        Degraded, using ResolvedParameters. Derived from the capability definition's
                        degradedPolicy.schedulable; written by the capability derivation, never by
                        operators.
                      type: boolean
                    degradedSince:
                      description: DegradedSince is when Status last transitioned
                        away from Active.
                      format: date-time
                      type: string
                    name:
                      description: |-
                        Name matches a spec.capabilities[*].name or a
                        status.modelGrantedCapabilities[*].capabilities[] entry.
                      type: string
                    paused:
                      description: |-
                        Paused is true only when a ZoneMaintenance override has suspended this
                        (pauseable) capability; pauseable:false capabilities are never Paused.
                      type: boolean
                    reason:
                      description: Reason explains a non-Active status; empty when
                        Status is Active.
                      type: string
                    resolvedParameters:
                      additionalProperties:
                        type: number
                      description: |-
                        ResolvedParameters carries the current numeric values for a parametric
                        hardware-native capability's spec.capabilities[*].parameters, resolved
                        from the sourced hardware spec fields.
                      type: object
                    status:
                      description: Status is the computed truth-table result (or an
                        override state).
                      enum:
                      - Active
                      - Degraded
                      - Paused
                      - Inactive
                      - Unavailable
                      - Failed
                      type: string
                  required:
                  - name
                  - paused
                  - status
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                description: Conditions is the standard set of controller conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectivity:
                description: Connectivity is Fleet Adapter connectivity telemetry.
                properties:
                  lastSeenAt:
                    description: LastSeenAt is the timestamp of the last received
                      heartbeat from this robot.
                    format: date-time
                    type: string
                  latencyMs:
                    description: LatencyMs is the round-trip latency of the last gRPC
                      ping.
                    format: int32
                    type: integer
                type: object
              currentZone:
                description: |-
                  CurrentZone is derived by the Zone Controller from position telemetry;
                  it may differ from spec.zone if the robot has physically crossed a zone
                  boundary.
                type: string
              estopState:
                description: |-
                  EstopState is the robot's emergency-stop status (RFC-0001 §9.6.2.3),
                  independent of Phase. Active states (Stopping/Stopped) pause the robot's
                  assigned FleetAction (§9.6.2.4). Empty is treated as Normal (no active estop).
                  Set by the SafetyStream estop path (§9.6.2, not yet built) from a CONFIRMED
                  EstopAck — never inferred from telemetry or a timeout; consumed by the
                  FleetAction controller. Estop is never fenced: a safe stop is always honoured.
                enum:
                - Normal
                - Stopping
                - Stopped
                - Resuming
                - Failed
                type: string
              firmwareInstall:
                description: |-
                  FirmwareInstall is the robot's OWN report of its firmware install state
                  (ADR-0033), distinct from FirmwareVersion above, which is the control plane's
                  record of what it pushed. The two disagreeing is the signal that matters: a
                  failed install leaves the robot running something other than the target, and
                  before this field the control plane had no way to learn that had happened.

                  Adapter-reported and projected on change only (RA-1); absent for an adapter
                  that does not implement push_firmware.
                properties:
                  attemptedVersion:
                    description: AttemptedVersion is the version a failed or in-flight
                      install targeted.
                    type: string
                  failureReason:
                    description: FailureReason is set only when Status is Failed.
                    type: string
                  reportedAt:
                    description: ReportedAt is when the adapter last reported this
                      state.
                    format: date-time
                    type: string
                  runningVersion:
                    description: |-
                      RunningVersion is what the robot says it is running now. On a failed install
                      this is NOT AttemptedVersion — it is whatever the robot fell back to, which is
                      the fact an operator needs and cannot infer.
                    type: string
                  status:
                    description: Status is the reported install state. Unset means
                      the adapter reports none.
                    enum:
                    - Running
                    - Updating
                    - Failed
                    type: string
                type: object
              firmwareVersion:
                description: |-
                  FirmwareVersion is the firmware the robot is currently running. Written by
                  the FirmwareRollout controller after a confirmed successful update (§9.1.7.2);
                  operators MUST NOT write it.
                type: string
              hardware:
                description: |-
                  Hardware is per-component runtime health, one entry per
                  spec.hardware[]. Written by the Health Monitor from Fleet Adapter
                  telemetry.
                items:
                  description: |-
                    HardwareComponentStatus is the observed runtime health of one component
                    declared in spec.hardware[]. Written by the Health Monitor from Fleet
                    Adapter telemetry.
                  properties:
                    degradationReason:
                      description: |-
                        DegradationReason is a human-readable reason from the Fleet Adapter;
                        empty when Status is Healthy.
                      type: string
                    degradedMetrics:
                      additionalProperties:
                        type: number
                      description: |-
                        DegradedMetrics carries type-specific numeric readings populated when
                        Status is not Healthy (e.g. a Camera's depthFrameRateFps). Numeric-only
