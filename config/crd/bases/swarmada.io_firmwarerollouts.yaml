---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: firmwarerollouts.swarmada.io
spec:
  group: swarmada.io
  names:
    kind: FirmwareRollout
    listKind: FirmwareRolloutList
    plural: firmwarerollouts
    shortNames:
    - fwr
    singular: firmwarerollout
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.newVersion
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.robotsUpdated
      name: Updated
      type: integer
    - jsonPath: .status.robotsTotal
      name: Total
      type: integer
    name: v1
    schema:
      openAPIV3Schema:
        description: FirmwareRollout is the Schema for the firmwarerollouts API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FirmwareRolloutSpec defines the desired state of a FirmwareRollout.
            properties:
              deliveryMechanism:
                default: PullOnIdle
                description: Delivery controls whether the robot pulls or is pushed
                  the update.
                enum:
                - PullOnIdle
                - PushImmediate
                type: string
              firmwareChecksum:
                description: |-
                  FirmwareChecksum is the SHA-256 digest of the firmware artifact, as
                  "sha256:<64 hex>". The detached signature is verified over this value; the
                  robot re-verifies the downloaded bytes against it before install (§9.1.7.1).
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              firmwareSignatureRef:
                description: |-
                  FirmwareSignatureRef references the detached signature or sigstore bundle for
                  the artifact, verified against SwarmadaConfig.spec.signing.trustRoots before
                  any dispatch. When requireSignatureVerification is true this MUST be set;
                  omitting it fails the rollout closed (§9.1.7.1, §9.2.8). Supported forms: an
                  OCI/https/s3 ref, or an inline "bundle:<base64>" signature.
                type: string
              firmwareUri:
                description: FirmwareURI is the download URL for the firmware artifact.
                type: string
              newVersion:
                description: |-
                  NewVersion is the target firmware version string.

                  Swarmada treats it as OPAQUE: it is never parsed, ordered or compared. Batch
                  classification is by EQUALITY only — a robot is "done" when
                  Status.FirmwareVersion == NewVersion and "updating" when its pending-firmware
                  annotation == NewVersion; the eligible set is sorted by NAME, not by version.
                  Vendor firmware strings are frequently not semver ("2.5.0-rc1", "v2.5.0",
                  "2026.06"), so constraining the form here would reject valid targets while
                  protecting nothing.

                  ModelRollout.NewVersion IS pattern-constrained to bare major.minor.patch,
                  because that controller refuses downgrades via versionIsNewer and therefore
                  needs a parseable order. The asymmetry is deliberate (RFC-0001 D2).
                minLength: 1
                type: string
              rollbackPolicy:
                default: Manual
                description: |-
                  RollbackPolicy controls what happens on failure.
                  Manual is strongly recommended (Auto can create fleet version inconsistency).
                enum:
                - Manual
                - Auto
                type: string
              safetyConstraints:
                description: SafetyConstraints restricts when updates may be applied.
                properties:
                  maintenanceWindowOnly:
                    default: false
                    description: |-
                      MaintenanceWindowOnly: only update robots during their configured
                      MaintenanceWindow. Slowest but least disruptive.
                    type: boolean
                  minBatteryPct:
                    default: 30
                    description: 'MinBatteryPct: do not update robots below this battery
                      level.'
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  requireIdleState:
                    default: true
                    description: 'RequireIdleState: only update robots in Idle phase.'
                    type: boolean
                type: object
              strategy:
                description: Strategy controls how the rollout progresses.
                properties:
                  rollingUpdate:
                    description: |-
                      RollingUpdate holds the RollingUpdate strategy's parameters (applies when
                      type is RollingUpdate). When omitted, the documented defaults apply
                      (see RollingUpdateOrDefault).
                    properties:
                      maxUnavailable:
                        default: 10%
                        description: |-
                          MaxUnavailable is the maximum number or percentage of robots that may
                          simultaneously be in the updating state.
                          Examples: "10%" or "5".
                        type: string
                      pauseOnError:
                        default: true
                        description: |-
                          PauseOnError halts the rollout if any robot fails to update: no further robot
                          enters the batch while a failure stands, though in-flight updaters continue.

                          The operator resumes with `swarmctl rollout resume`, which is gated on the
                          rollout-resume custom verb (§9.5.3) and writes the swarmada.io/rollout-resume
                          annotation the controller consumes. Resume EXCLUDES the robots that failed from
                          further attempts by this rollout rather than retrying them (ADR-0041); a fixed
                          artifact needs a fresh rollout. Excluded robots are named in
                          status.excludedRobots and count as settled, so the rollout can reach a terminal
                          phase and its record becomes deletable.
                        type: boolean
                    type: object
                  type:
                    allOf:
                    - enum:
                      - RollingUpdate
                    - enum:
                      - RollingUpdate
                    default: RollingUpdate
                    description: Type selects the rollout strategy. Only RollingUpdate
                      is supported at v0.1.
                    type: string
                type: object
              targetSelector:
                description: TargetSelector selects which robots receive this firmware
                  update.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            required:
            - firmwareChecksum
            - firmwareUri
            - newVersion
            - targetSelector
            type: object
          status:
            description: FirmwareRolloutStatus defines the observed state of a FirmwareRollout.
            properties:
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentBatch:
                description: |-
                  CurrentBatch is the per-robot active update batch (§6.6). Each entry carries
                  the robot's live updatePhase, sourced from adapter UpdateProgress.
                items:
                  description: |-
                    RolloutBatchRobot is a per-robot entry in a rollout's active update batch. Its
                    updatePhase reflects the robot's most recently reported intra-update progress
                    (the adapter's advisory UpdateProgress, §9.2); when the adapter reports none it
                    stays at the initial phase the controller set when the robot entered the batch.
                    The phase enum differs by rollout kind (see UpdatePhase), so the field is a
                    string validated by the control plane rather than a single CRD enum.
                  properties:
                    capabilitiesSuspendedAt:
                      description: |-
                        CapabilitiesSuspendedAt is when this robot's affected capabilities were
                        suspended for the update (ModelRollout only), stamped per attempt at batch
                        entry.
                      format: date-time
                      type: string
                    namespace:
                      description: Namespace is the robot's namespace.
                      type: string
                    previousVersion:
                      description: PreviousVersion is the robot's firmware/model version
                        before this update.
                      type: string
                    robotName:
                      description: RobotName is the robot currently in the active
                        update batch.
                      type: string
                    updatePhase:
                      description: |-
                        UpdatePhase is the robot's current intra-update phase. Firmware:
                        Pulling / Installing / Verifying / Rebooting. Model:
                        Downloading / Verifying / Installing / HealthChecking. Advisory — sourced from
                        the adapter's UpdateProgress, else the controller's initial phase.
                      type: string
                    updateStartedAt:
                      description: |-
                        UpdateStartedAt is when the robot entered the active update batch. Preserved
                        across reconciles for the current attempt.
                      format: date-time
                      type: string
                  required:
                  - robotName
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              excludedRobots:
                description: |-
                  ExcludedRobots names the robots an operator resume removed from this rollout
                  (ADR-0041). They failed, the operator resumed past them, and this rollout will
                  not attempt them again — retrying a failed artifact is what a FRESH rollout is
                  for. They are excluded from every progress bucket, so they neither re-pause the
                  rollout nor hold it short of a terminal phase; a non-empty list surfaces that the
                  fleet did not fully converge on this version.
                items:
                  type: string
                type: array
              failedRobots:
                items:
                  description: RolloutRobotResult records the failure outcome for
                    a single robot.
                  properties:
                    failedAt:
                      format: date-time
                      type: string
                    namespace:
                      type: string
                    previousVersion:
                      type: string
                    reason:
                      type: string
                    robotName:
                      type: string
                  required:
                  - robotName
                  type: object
                type: array
              pausedAt:
                format: date-time
                type: string
              phase:
                description: RolloutPhase is common to both FirmwareRollout and ModelRollout.
                enum:
                - Pending
                - InProgress
                - Paused
                - Succeeded
                - Failed
                type: string
              robotsFailed:
                format: int32
                type: integer
              robotsPending:
                format: int32
                type: integer
              robotsSkipped:
                description: |-
                  RobotsSkipped is an informational sub-count of RobotsPending: robots failing a
                  safety constraint this cycle, re-evaluated next cycle. Not a disjoint total term.
                format: int32
                type: integer
              robotsTotal:
                format: int32
                type: integer
              robotsUpdated:
                format: int32
                type: integer
              startedAt:
                description: StartedAt/CompletedAt/PausedAt are top-level rollout
                  timing stamps.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
