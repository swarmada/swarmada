apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Lets config/default/kustomization.yaml reference this directory as a single
# resource (kustomize requires a kustomization file to accumulate a directory
# — a bare directory of plain YAML, as used by `make install`'s
# `kubectl apply -f config/crd/bases/`, is not enough for `kubectl apply -k`).
# Keep this file's resource list in sync with the thirteen CRDs generated by
# `make manifests` (controller-gen) — it does not regenerate this file.
resources:
  - swarmada.io_discoveredrobots.yaml
  - swarmada.io_firmwarerollouts.yaml
  - swarmada.io_fleetadapters.yaml
  - swarmada.io_fleetactions.yaml
  - swarmada.io_fleettasks.yaml
  - swarmada.io_fleetzones.yaml
  - swarmada.io_modelpolicies.yaml
  - swarmada.io_modelrollouts.yaml
  - swarmada.io_robotclasses.yaml
  - swarmada.io_robotprobes.yaml
  - swarmada.io_robots.yaml
  - swarmada.io_swarmadaconfigs.yaml
  - swarmada.io_zonemaintenances.yaml
