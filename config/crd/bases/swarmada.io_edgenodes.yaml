---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: edgenodes.swarmada.io
spec:
  group: swarmada.io
  names:
    kind: EdgeNode
    listKind: EdgeNodeList
    plural: edgenodes
    shortNames:
    - en
    singular: edgenode
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeClass
      name: Class
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.zoneControlAvailable
      name: ZoneControl
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          EdgeNode is the Schema for the edgenodes API.

          An EdgeNode declares a non-robot node the control plane is specified to push
          to: an edge or zone-controller box serving a zone, not a machine that moves. It
          exists so a deployment whose detection cascade runs beside the zone rather than
          onboard a robot is expressible — see ModelRolloutSpec.TargetKind.

          At v0.4 no controller reconciles an EdgeNode. No session is bound to one,
          nothing writes its status, and a ModelRollout with targetKind EdgeNode is
          refused. The shipped zone-controller runtime does not read this kind. The field
          descriptions state the specified contract.

          It is NOT an executor. An endpoint executor (ComputeEndpoint) has no
          ControlStream and no session the control plane can push a ModelUpdate down, so
          model policy for an endpoint is a version REQUIREMENT plus a scheduling gate
          and provenance on the result, never a ModelRollout target (ADR-0006).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EdgeNodeSpec is the operator-authored declaration of a non-robot
              node.
            properties:
              identity:
                description: Identity is the mTLS identity the node's session must
                  present.
                properties:
                  commonName:
                    description: |-
                      CommonName is the subject CN on the node's client certificate, issued by
                      the ControlStream CA. It is specified as the key that binds a session to
                      this object, with a session whose CN matches no EdgeNode refused. At v0.4 no
                      session is checked against it, and nothing is refused on it.
                    minLength: 1
                    type: string
                  spiffeID:
                    description: |-
                      SPIFFEID optionally pins the node's SPIFFE identity. It is specified as
                      checked in addition to CommonName, never instead of it. At v0.4 no code reads
                      it: no session is checked against it, and setting it constrains nothing.
                    type: string
                required:
                - commonName
                type: object
              installedModels:
                description: |-
                  InstalledModels declares the inference model packages deployed to this
                  node's compute. It is specified as the list a ModelRollout targeting this
                  node locates its entry in by spec.modelName, as on a Robot; runtime state
                  lives only in status.installedModels[]. At v0.4 no code reads it: the
                  ModelRollout controller skips a rollout whose spec.targetKind is EdgeNode,
                  with a TargetKindNotImplemented Warning event, and updates no node.
                  MaxItems bounds CEL cost (see Robot.spec.hardware's comment).
                items:
                  description: ClassModel is a default inference model installed on
                    robots of a class.
                  properties:
                    grantsCapabilities:
                      description: |-
                        GrantsCapabilities lists the capabilities this model provides. At v0.4 it
                        is read only by candidate filter 7 (a robot is withheld from an action
                        needing one of these names while the model is Updating). It adds nothing
                        to spec.capabilities[] or status.capabilities[]: a model-granted capability
                        comes from a ModelRollout's own grantsCapabilities. MaxItems bounds CEL
                        cost (see Robot.spec.hardware's comment).
                      items:
                        type: string
                      maxItems: 32
                      type: array
                      x-kubernetes-list-type: set
                    modelUri:
                      description: |-
                        ModelURI is where the Robot Agent fetches the model artifact
                        (e.g. "oci://registry.swarmada.io/models/item-recognition:3.2.1").
                        Scheme-constrained to match ModelRollout.spec.modelUri so a model URI is
                        validated identically wherever it is declared.
                      minLength: 1
                      pattern: ^(oci|s3|https)://
                      type: string
                    name:
                      description: |-
                        Name is the logical model name; it must match
                        Robot.spec.installedModels[*].name after a ModelRollout completes.
                      maxLength: 128
                      minLength: 1
                      type: string
                    requiredHardware:
                      description: |-
                        RequiredHardware lists component names specified to be Healthy for the
                        model to run, a degraded dependency moving the model Inactive. Not
                        implemented at v0.4: no controller reads this list; capability derivation
                        uses each capability's own requiredHardware. MaxItems bounds CEL cost (see
                        Robot.spec.hardware's comment).
                      items:
                        type: string
                      maxItems: 32
                      type: array
                      x-kubernetes-list-type: set
                    version:
                      description: Version is the model version (semver).
                      pattern: ^\d+\.\d+\.\d+$
                      type: string
                  required:
                  - modelUri
                  - name
                  - version
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              maintenanceWindow:
                description: |-
                  MaintenanceWindow is specified as this node's update window for a rollout
                  whose safetyConstraints.maintenanceWindowOnly is true. No code reads it at
                  v0.4: a ModelRollout that targets an EdgeNode is refused.
                properties:
                  dayOfWeek:
                    description: DayOfWeek the window recurs on.
                    enum:
                    - Monday
                    - Tuesday
                    - Wednesday
                    - Thursday
                    - Friday
                    - Saturday
                    - Sunday
                    type: string
                  durationMinutes:
                    description: DurationMinutes is how long the window stays open.
                    format: int32
                    maximum: 480
                    minimum: 15
                    type: integer
                  startHour:
                    description: StartHour is the hour (24h UTC) at which the window
                      opens.
                    format: int32
                    maximum: 23
                    minimum: 0
                    type: integer
                required:
                - dayOfWeek
                - durationMinutes
                - startHour
                type: object
              nodeClass:
                description: |-
                  NodeClass is the class field that identifies what this node is. Required:
                  there is no defensible default, because the safety consequences of a rollout
                  differ by class (a ZoneController carries estop authority; a ComputeNode
                  does not).
                enum:
                - ZoneController
                - SiteUplink
                - ComputeNode
                type: string
              zones:
                description: |-
                  Zones are the FleetZones this node serves. A ZoneController MUST list at
                  least one, and the API server refuses one that lists none (the CEL rule on
                  EdgeNodeSpec); a ComputeNode or SiteUplink may list none. They are specified
                  as what a rollout's blast radius is reported against
                  (status.zoneControlAvailable). No code reads them at v0.4.
                items:
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
            required:
            - identity
            - nodeClass
            type: object
            x-kubernetes-validations:
            - message: a ZoneController must list at least one zone in spec.zones;
                a ComputeNode or SiteUplink may list none
              rule: self.nodeClass != 'ZoneController' || (has(self.zones) && size(self.zones)
                > 0)
          status:
            description: |-
              EdgeNodeStatus is specified to be written only by the control plane, as the
              surface a ModelRollout against this node is read through — see the MUST list on
              ZoneControlAvailable and Capabilities below. At v0.4 nothing writes any field of
              it.
            properties:
              agentVersion:
                description: AgentVersion is the edge runtime build the node registered
                  with.
                type: string
              capabilities:
                description: |-
                  Capabilities is the computed capability set this node offers. During a
                  ModelRollout against this node, every name in the rollout's
                  grantsCapabilities MUST appear here with status Unavailable and a reason
                  naming the rollout; after a successful rollout each MUST read Active, and a
                  revoked name MUST be absent. It is specified as the observable that says
                  whether the zone's detection is currently degraded. Nothing writes it at v0.4.
                items:
                  description: |-
                    CapabilityStatusEntry is the computed runtime status of one capability,
                    from either spec.capabilities[] or a model-granted synthetic entry (see the
                    Capability Derivation Truth Table).
                  properties:
                    degradedSchedulable:
                      description: |-
                        DegradedSchedulable reflects the capability's degradedPolicy: when true, the
                        Scheduler may satisfy parametric constraints with this capability while it is
                        Degraded, using ResolvedParameters. Derived from the capability definition's
                        degradedPolicy.schedulable; written by the capability derivation, never by
                        operators.
                      type: boolean
                    degradedSince:
                      description: DegradedSince is when Status last transitioned
                        away from Active.
                      format: date-time
                      type: string
                    name:
                      description: |-
                        Name matches a spec.capabilities[*].name or a
                        status.modelGrantedCapabilities[*].capabilities[] entry.
                      type: string
                    paused:
                      description: |-
                        Paused is true only when a ZoneMaintenance override has suspended this
                        (pauseable) capability; pauseable:false capabilities are never Paused.
                      type: boolean
                    reason:
                      description: Reason explains a non-Active status; empty when
                        Status is Active.
                      type: string
                    resolvedParameters:
                      additionalProperties:
                        type: number
                      description: |-
                        ResolvedParameters carries the current numeric values for a parametric
                        hardware-native capability's spec.capabilities[*].parameters, resolved
                        from the sourced hardware spec fields.
                      type: object
                    status:
                      description: Status is the computed truth-table result (or an
                        override state).
                      enum:
                      - Active
                      - Degraded
                      - Paused
                      - Inactive
                      - Unavailable
                      - Failed
                      type: string
                  required:
                  - name
                  - paused
                  - status
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                description: |-
                  Conditions is specified to carry Registered, Ready and Updating. Nothing
                  writes it at v0.4.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              installedModels:
                description: |-
                  InstalledModels is the node's per-model runtime report, parallel to
                  spec.installedModels[] — the same shape a Robot reports, so one reader
                  serves both target kinds.
                items:
                  description: |-
                    InstalledModelStatusEntry is the runtime state of one installed model,
                    parallel to spec.installedModels[] — mirroring the Kubernetes
                    spec.containers[] / status.containerStatuses[] pattern. It is written by the
                    control plane from the adapter's reports, not by a component on the robot.
                  properties:
                    activeAt:
                      description: ActiveAt is when the model last transitioned to
                        Active.
                      format: date-time
                      type: string
                    failureReason:
                      description: FailureReason is empty when Status is Active.
                      type: string
                    name:
                      description: Name matches a spec.installedModels[*].name entry.
                      type: string
                    runningVersion:
                      description: |-
                        RunningVersion is the version currently loaded on the robot; it may lag
                        spec during a rollout.
                      type: string
                    status:
                      description: Status is the model's current runtime state.
                      enum:
                      - Active
                      - Updating
                      - Failed
                      - Inactive
                      type: string
                  required:
                  - name
                  - status
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              lastHeartbeatAt:
                description: |-
                  LastHeartbeatAt is the last liveness signal on the node's session. It is
                  specified to be written on a material transition only, never per telemetry
                  tick (RA-1).
                format: date-time
                type: string
              modelGrantedCapabilities:
                description: |-
                  ModelGrantedCapabilities records what a completed ModelRollout granted, per
                  model. It is specified to be written only by the rollout controller, which
                  refuses EdgeNode targets at v0.4, so nothing writes it.
                items:
                  description: |-
                    ModelGrantedCapabilityEntry records the capabilities a completed
                    ModelRollout has granted for one installed model. Written exclusively by
                    the OTA/Model Update Manager; operators MUST NOT write this field.
                  properties:
                    capabilities:
                      description: |-
                        Capabilities are the names currently granted by this model version.
                        Revoked names are absent; the Capability Controller drops them from the
                        computed status.capabilities[] on its next reconciliation.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    grantedBy:
                      description: GrantedBy is the name of the ModelRollout resource
                        that last wrote this entry.
                      type: string
                    modelName:
                      description: ModelName matches a spec.installedModels[*].name
                        entry.
                      type: string
                  required:
                  - grantedBy
                  - modelName
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - modelName
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  was computed from.
                format: int64
                type: integer
              phase:
                description: Phase is the node's lifecycle phase.
                enum:
                - Pending
                - Ready
                - Updating
                - Degraded
                - Offline
                type: string
              registeredAt:
                description: RegisteredAt is when the current session bound to this
                  object.
                format: date-time
                type: string
              roles:
                description: |-
                  Roles are the roles the registered runtime reports serving (observed, not
                  declared — see EdgeNodeRole).
                items:
                  description: |-
                    EdgeNodeRole is a role the registered runtime reports it is actually serving.
                    Roles are OBSERVED, not declared: spec.nodeClass is the operator's intent and
                    status.roles is what the node came back with, so a ZoneController that is also
                    carrying the site uplink (the common small-site shape in ADR-0010) reports both
                    without the operator having to describe the co-location twice.
                  enum:
                  - ZoneControl
                  - SiteUplink
                  - Inference
                  type: string
                type: array
                x-kubernetes-list-type: set
              zoneControlAvailable:
                description: |-
                  ZoneControlAvailable reports whether the node is still holding local
                  authority — zone admission and headless emergency stop — for spec.zones.
                  A ModelRollout MUST NOT suspend it: a model update may take a node's
                  inference capabilities Unavailable, never its estop authority, so this MUST
                  stay true across every phase of a rollout on a ZoneController. A pointer
                  because false ("authority lost") and unset ("never reported") are different
                  facts and only one of them is an incident. Nothing writes it at v0.4, so it
                  is always unset.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
