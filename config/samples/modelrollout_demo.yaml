#
# Demonstrates the ModelRollout CRD and the capability suspension that
# distinguishes it from a FirmwareRollout: while a robot is mid-update, every
# capability its `providingModel` grants derives Inactive for exactly that robot,
# so the scheduler stops matching it to work that needs the model. Three stages:
# `seed` puts the fleet on a baseline version, `rollout` swaps it one robot at a
# time (watch `status.capabilitiesSuspendedOn`), and `corrupt` declares a digest
# that does not match the artifact so the adapter refuses the push and no
# capability is ever suspended for an update that cannot be delivered. Apply one
# stage at a time:
#
#     kubectl apply -f config/samples/modelrollout_demo.yaml -l swarmada.io/demo-step=<step>
#
# NO STATUS IS DECLARED ANYWHERE IN THIS FILE.
#
# THE ARTIFACT IS A STAND-IN, exactly as the Layered Demo Plan requires: "no
# GR00T / Isaac / OCI registry needed". modelUri names a registry that does not
# exist; nothing is fetched by the control plane, which pushes the URI and the
# digest to the adapter over the ControlStream and lets the adapter verify.
# adapters/simulation/sim_adapter.py stands in for the download and hashes a
# deterministic payload, sha256("<modelName>:<newVersion>") — which is what the
# checksums below are. Get one wrong and the adapter refuses the push, which is
# the fail-closed behaviour the corrupt-artifact step exercises on purpose.
---
# STEP: seed. Brings the fleet onto nav-stack 1.3.0 — the plan's step (1),
# "fleet running model nav-1.3". A real ModelRollout doing real pushes over the
# wire, not a hand-written status. maxUnavailable 100% because this is staging,
# not the demo.
apiVersion: swarmada.io/v1
kind: ModelRollout
metadata:
  name: nav-stack-1-3-0-seed
  namespace: warehouse-a
  labels:
    swarmada.io/demo-step: seed
spec:
  targetKind: Robot
  targetSelector: {}
  modelName: nav-stack
  newVersion: "1.3.0"
  modelUri: "oci://registry.invalid/swarmada/nav-stack:1.3.0"
  modelChecksum: "sha256:f885b4e93b96b1775ef24fffb19e1577bb2404a51c9a19bccf51fbaa6da7f61a"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "100%"
      pauseOnError: true
  safetyConstraints:
    minBatteryPct: 30
    requireIdleState: true
  rollbackPolicy: Auto
---
# STEP: rollout. The plan's steps (2)/(3): swap to 1.4.0 one robot at a time and
# watch the model-driven capability suspend for the robot being updated.
apiVersion: swarmada.io/v1
kind: ModelRollout
metadata:
  name: nav-stack-1-4-0
  namespace: warehouse-a
  labels:
    swarmada.io/demo-step: rollout
spec:
  targetKind: Robot
  targetSelector: {}
  modelName: nav-stack
  newVersion: "1.4.0"
  modelUri: "oci://registry.invalid/swarmada/nav-stack:1.4.0"
  modelChecksum: "sha256:af9c5822d90a2dd77e2e91e8f22d9e653b398c4214c4d2d43736dc5dbe175cf5"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "1"
      pauseOnError: true
  safetyConstraints:
    minBatteryPct: 30
    requireIdleState: true
  rollbackPolicy: Auto
---
# STEP: corrupt. A rollout to 1.5.0 whose declared digest does NOT match the
# artifact the robot receives — a mirror, proxy or cache serving something else,
# which is precisely the case the robot-side re-verification (C7.2) exists for.
# The adapter refuses the push; the control plane never marks the model
# Updating, so no capability is ever suspended for an update that cannot be
# delivered. Nothing on any robot changes.
apiVersion: swarmada.io/v1
kind: ModelRollout
metadata:
  name: nav-stack-1-5-0-corrupt
  namespace: warehouse-a
  labels:
    swarmada.io/demo-step: corrupt
spec:
  targetKind: Robot
  targetSelector: {}
  modelName: nav-stack
  newVersion: "1.5.0"
  modelUri: "oci://registry.invalid/swarmada/nav-stack:1.5.0"
  # The digest of nav-stack:1.4.0, declared against the 1.5.0 artifact. Well
  # formed, verifiable, and wrong for these bytes.
  modelChecksum: "sha256:af9c5822d90a2dd77e2e91e8f22d9e653b398c4214c4d2d43736dc5dbe175cf5"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "1"
      pauseOnError: true
  safetyConstraints:
    minBatteryPct: 30
    requireIdleState: true
  rollbackPolicy: Auto
