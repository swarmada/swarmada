#
# Demonstrates ModelRollout and ModelPolicy against a NON-ROBOT target: an
# EdgeNode of class ZoneController, the box a zone's detection cascade runs on.
# Three stages: `node` declares the zone and the edge node; `rollout` addresses a
# signed ModelRollout to it (see the implementation-status note below for what
# the controller then does); `policy` declares a ModelPolicy whose targetKind is
# EdgeNode, whose quality gate blocks a candidate version on the merits and
# records which thresholds it missed. The gate is target-kind-independent — it
# judges the artifact, not where the artifact lands. Apply one stage at a time:
#
#     kubectl apply -f config/samples/modelrollout_edge_demo.yaml -l swarmada.io/demo-step=<step>
#
# NO STATUS IS DECLARED ANYWHERE IN THIS FILE.
#
# THE ARTIFACT IS A STAND-IN. No GR00T, no Isaac, no OCI registry: modelUri names
# a registry that does not exist and nothing is fetched. The digests below are
# sha256("<modelName>:<version>"), the same convention config/samples/modelrollout_demo.yaml
# uses, so they are well formed and reproducible without an artifact existing.
#
# READ THIS BEFORE RUNNING IT. `spec.targetKind: EdgeNode` is SPECIFIED, NOT
# IMPLEMENTED at v0.4 (rfcs/rfc-0001-core-spec/crds/modelrollout.md, "Implementation
# status"). The API server admits the edge-targeted rollout happily (once signed,
# below); it is the ModelRollout CONTROLLER that REFUSES it, with a TargetKindNotImplemented
# warning event rather than falling through to robots. That refusal is what the
# `rollout` stage below shows, and the runbook says so on its first screen.
#
# THE ROLLOUT STAGE DECLARES NO modelSignatureRef, ON PURPOSE. Applying it raw is
# rejected at admission because signature verification is enforced (and cannot be
# turned off — see the runbook's ITEM-E4). That rejection is a demo beat, not a
# defect in this file: an unsigned model must not reach an edge box, which is the
# facility's trust anchor (ADR-0010). The runbook's Step 3b signs the digest with
# the namespace trust root and pipes the signed manifest to `kubectl apply -f -`.
#
# AND NOTE, BEFORE YOU APPLY THE ROLLOUT STAGE: the ModelRollout it creates is
# PERMANENTLY UNDELETABLE. vmodelrollout.swarmada.io only permits deleting a
# rollout in a terminal phase, and an EdgeNode-targeted rollout never gets a phase
# at all. Teardown is `kind delete cluster`. See the runbook's ITEM-E6.
---
# STEP: node. The zone the Zone-Controller below serves, so that
# EdgeNode.spec.zones names something real — spec.zones is what a rollout's blast
# radius would be reported against (status.zoneControlAvailable). Note what this
# object is NOT: FleetZone.spec.edgeNode is the ADAPTER-facing EdgeStream address
# (UC-4.1's subject), a different concept from the EdgeNode resource this demo
# rolls to, and it is deliberately absent here.
apiVersion: swarmada.io/v1
kind: FleetZone
metadata:
  name: warehouse-a
  namespace: warehouse-a
  labels:
    swarmada.io/demo-step: node
spec:
  displayName: "Receiving and staging area — east wing"
---
# STEP: node. The Zone-Controller edge node — a non-robot target. nodeClass is
# required: a ZoneController carries headless e-stop authority and a ComputeNode
# does not, so the class changes what a rollout against it costs.
#
# spec.installedModels is the DECLARED model set, the same shape a Robot carries.
# A ModelRollout locates its entry by spec.modelName exactly as it does on a Robot.
apiVersion: swarmada.io/v1
kind: EdgeNode
metadata:
  name: zc-warehouse-a
  namespace: warehouse-a
  labels:
    swarmada.io/demo-step: node
    zone: warehouse-a
    swarmada.io/edge-role: zone-controller
spec:
  nodeClass: ZoneController
  identity:
    commonName: edge-zc-warehouse-a
  zones:
    - warehouse-a
  installedModels:
    - name: defect-cascade
      version: "1.2.0"
      modelUri: "oci://registry.invalid/swarmada/defect-cascade:1.2.0"
      grantsCapabilities:
        - zone_defect_detection
---
# STEP: rollout. The D6 beat-1 object: a ModelRollout addressed to a non-robot
# Zone-Controller node.
#
# requiredNodeCapabilities is the EdgeNode eligibility axis and is REJECTED by CEL
# on a Robot-targeted rollout; requiredHardware is its robot-side counterpart and
# is rejected here. The two axes cannot be crossed — see the runbook's Step 2,
# which shows both rejections.
apiVersion: swarmada.io/v1
kind: ModelRollout
metadata:
  name: defect-cascade-1-3-0-edge
  namespace: warehouse-a
  labels:
    swarmada.io/demo-step: rollout
spec:
  targetKind: EdgeNode
  targetSelector:
    matchLabels:
      swarmada.io/edge-role: zone-controller
  modelName: defect-cascade
  newVersion: "1.3.0"
  modelUri: "oci://registry.invalid/swarmada/defect-cascade:1.3.0"
  # sha256("defect-cascade:1.3.0") — the stand-in digest convention
  # config/samples/modelrollout_demo.yaml uses. Reproduce it with:
  #   printf 'defect-cascade:1.3.0' | shasum -a 256
  modelChecksum: "sha256:ee0d4e70b0aa137b78f508493a6ba856ef91a60ba833be77b9ad1eb2d764f7b4"
  requiredNodeCapabilities:
    - zone_defect_detection
  grantsCapabilities:
    - zone_defect_detection
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "1"
      pauseOnError: true
  rollbackPolicy: Manual
---
# STEP: policy. The D6 beat-2 object: the quality gate that decides whether a
# candidate version of defect-cascade may be deployed AT ALL.
#
# targetKind: EdgeNode requires targetNodeSelector (CEL) and rejects
# targetRobotSelector. The gate itself is target-kind-INDEPENDENT — nothing in a
# threshold becomes more permissive because inference moved off the robot and onto
# the box beside it. spec.targetKind chooses WHERE a passing model is deployed; it
# never changes WHETHER it passes.
apiVersion: swarmada.io/v1
kind: ModelPolicy
metadata:
  name: cascade-edge-gate
  namespace: warehouse-a
  labels:
    swarmada.io/demo-step: policy
spec:
  modelName: defect-cascade
  targetKind: EdgeNode
  targetNodeSelector:
    matchLabels:
      swarmada.io/edge-role: zone-controller
  trigger:
    type: Webhook
    webhook:
      enabled: true
      authSecretRef: modelpolicy-hmac
  qualityGate:
    minEvalEpisodes: 500
    requireRealEval: false
    customMetrics:
      - name: detection_recall
        operator: GreaterThanOrEqual
        threshold: 0.90
      - name: false_positive_rate
        operator: LessThanOrEqual
        threshold: 0.02
  autoDeployOn: QualityGatePass
  rolloutTemplate:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: "1"
        pauseOnError: true
    rollbackPolicy: Manual
