name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly run for the long kind e2e gate (demo-test), which is excluded from
  # pull_request because of its runtime. See the demo-test job for the reasoning.
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go: tidy · build · lint · test ────────────────────────────────────────────
  go:
    name: Go (build · lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Tidy and verify modules
        run: make mod-tidy

      - name: Build controller-manager
        run: make build

      # golangci-lint v2 (the repo's .golangci.yml is the v2 schema). The install
      # script with no version arg fetches the latest stable release (v2 line);
      # append a tag (e.g. ... | sh -s -- -b DIR v2.1.6) to pin.
      - name: Install golangci-lint v2
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint (golangci-lint v2)
        run: make lint-go

      - name: Test (race detector + coverage)
        run: make test-go

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.txt
          if-no-files-found: ignore

  # ── Python: lint · test ───────────────────────────────────────────────────────
  python:
    name: Python (lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Makefile runs a Go-discovery preflight at parse time (it errors if no
      # go binary is found), so every `make` target — Python included — needs Go
      # present even though these targets do not compile Go.
      - name: Set up Go (Makefile preflight)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          make install-py

      - name: Lint (ruff + mypy)
        run: make lint-py

      - name: Test (pytest)
        run: make test-py

  # ── Proto: proto3 conventions · buf lint · buf breaking-vs-main ────────────────
  proto:
    name: Proto (lint · breaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so buf can diff the module against main

      # check-proto3.sh runs `buf breaking --against '.git#branch=main'` only when
      # a local `main` ref exists. Create one from origin/main (no-op when the
      # push is already on main, hence `|| true`).
      - name: Ensure local main ref
        run: git fetch origin main:main || true

      - name: Set up Go (Makefile preflight)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Proto lint + breaking-change check
        run: make proto-lint

  # ── Helm: chart-CRD sync · lint · render smoke ────────────────────────────────
  helm:
    name: Helm (sync · lint · render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Makefile runs a Go-discovery preflight at parse time, so even the
      # helm-only targets need a go binary present.
      - name: Set up Go (Makefile preflight)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Guard the "chart is derived from config/, never a divergent hand-copy" rule:
      # regenerate the chart CRDs from config/crd/bases and fail if they differ from
      # what is committed.
      - name: Verify chart CRDs are in sync with config/crd/bases
        run: make helm-verify-sync

      - name: Lint chart
        run: make helm-lint

      - name: Render smoke test (default + metrics toggles)
        run: make helm-template

  # ── Quickstart: real end-to-end on kind (the anti-rot assertion) ──────────────
  # Brings the whole control plane up on a kind cluster, applies the sample fleet,
  # drives the robots Ready, and fails the build unless the REAL scheduler assigns
  # a FleetTask (examples/warehouse-quickstart/run.sh prints ✅ / exits non-zero).
  # This is what keeps "getting started" from silently rotting.
  quickstart:
    name: Quickstart (kind e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # The manager image build regenerates the Go proto stubs (they are
      # .gitignored), so protoc + the pinned plugins must be present. Versions
      # match the Makefile (PROTOC_GEN_GO_VERSION / PROTOC_GEN_GO_GRPC_VERSION).
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install proto plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kind
        run: |
          curl -sSLo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind

      # make quickstart-test creates the kind cluster, builds + loads the image,
      # deploys the control plane, applies config/samples, drives readiness,
      # asserts the scheduler assigned a task, and tears the cluster down.
      - name: Quickstart end-to-end (build · deploy · assign · assert)
        run: make quickstart-test

  # ── Full-surface demo-test: the headless coverage gate ───────────────────────
  # make demo-test asserts every targeted RobotPhase / FleetAction phase / estop state,
  # the §9.3.8 alert expressions (fire AND clear) and RA-1, against a real control plane
  # driven by the live sim adapter over a mutually-authenticated ControlStream.
  #
  # It is wired here because it was NOT: the target existed, the README pointed at it, and
  # no workflow ran it — so it sat structurally unpassable (it deployed the plaintext
  # overlay, under which no FleetAction can ever be assigned) without anything going red.
  # An unreferenced gate is not a gate.
  #
  # NOT run on pull_request: cert-manager install + image build + the ~95s assertion window
  # put this well past the quickstart job, and it is too slow to sit on every push. It runs
  # on push to main and nightly instead, which still catches a regression within a day of
  # merge. Promote it to pull_request if that ever proves too loose.
  demo-test:
    name: Full-surface demo-test (kind e2e, coverage gate)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Same rationale as the quickstart job: the manager image build regenerates the
      # .gitignored Go proto stubs, and demo_test.py + sim_adapter.py need the PYTHON
      # stubs, which `make proto-py` builds from the same protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install proto plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kind
        run: |
          curl -sSLo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind

      # grpcio is the adapter's transport; the run.sh preflight builds the proto stubs.
      - name: Install Python gRPC runtime
        run: python3 -m pip install --upgrade grpcio grpcio-tools protobuf

      # run.sh installs cert-manager, deploys config/overlays/quickstart-mtls, drives the
      # live adapter, asserts, prints the COVERAGE SUMMARY naming what it did NOT exercise
      # (EdgeStream/C8 is skipped here — cmd/edge is not published in this repository), and
      # deletes the cluster on exit.
      - name: Full-surface demo-test (assert every phase · estop · §9.3.8 alert · RA-1)
        run: make demo-test

  # ── Prose: documentation voice ────────────────────────────────────────────────
  # The eight Swarmada style rules in .vale/styles/. They existed as a style guide
  # with no runner from the day they were written; vale now reports zero errors
  # across the tree, so the gate can be turned on rather than left as decoration.
  prose:
    name: Prose (vale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A pinned release binary rather than a marketplace action: one fewer
      # supply-chain dependency in a repository whose readers are evaluating whether
      # to trust a robot fleet control plane, and the version that produced the first
      # clean run is the version that gates every run after it.
      - name: Install vale 3.17.1
        run: |
          curl -sSfL -o vale.tar.gz \
            https://github.com/errata-ai/vale/releases/download/v3.17.1/vale_3.17.1_Linux_64-bit.tar.gz
          tar -xzf vale.tar.gz vale
          sudo mv vale /usr/local/bin/vale
          vale --version

      # vale exits non-zero on errors only; warnings and suggestions do not fail,
      # per MinAlertLevel and the exemptions in .vale.ini.
      - name: Lint prose (vale)
        run: vale .

  # ── Adapter conformance ───────────────────────────────────────────────────────
  # The suite RFC-0001 §9.2.8 names and adapters/CONFORMANCE.md publishes, and the
  # evidence behind "vendor-neutral by demonstration". It had no CI job from the day
  # it was written, and it ABORTED on the in-tree reference adapter for an unknown
  # period: a duplicate check id tripped report.py's integrity guard sixty seconds in.
  # The guard was correct. Nothing was running it.
  conformance:
    name: Conformance (simulation adapter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Makefile's Go-discovery preflight runs at parse time, so every make target
      # needs Go present even when it compiles none.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          make install-py

      # Both scenarios. The fault run exercises the degrade/recover path, which the
      # healthy run never reaches.
      - name: Conformance — healthy fleet
        run: make conformance-sim

      - name: Conformance — hardware fault
        run: make conformance-sim-fault
