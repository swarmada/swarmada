syntax = "proto3";

package compute.v1;

import "fleet_adapter/v1/fleet_adapter.proto";

option go_package = "github.com/swarmada/swarmada/proto/compute/v1;computev1";
option java_package = "io.swarmada.compute.v1";

// ═══════════════════════════════════════════════════════════════════════════
// ComputeRuntimeService — the Grpc binding's wire contract.
//
// This is the ONLY new proto package in the Draft 4 design: the withdrawn
// `compute_adapter/v1` registry (placement engine, capacity model, identity
// model, its own lease protocol) is not coming back. What remains is
// this one service definition, dialed against an endpoint the control plane
// already resolved.
//
// TOPOLOGY — the INVERSE of fleet_adapter.v1.FleetAdapterService. A robot sits
// behind NAT and dials OUT to the control plane, which is why FleetAdapterService
// makes the control plane the server. A ComputeEndpoint is, by construction,
// addressable — anything addressable becomes a task step — a Kubernetes Service or a facility-LAN address the control
// plane can reach directly. So here the CONTROL PLANE IS THE CLIENT and the
// compute runtime (the Service-contract executor) is the SERVER, implementing
// this service. No reverse dial-out is needed or attempted.
//
// Every RPC is idempotent under the same Invocation.id: a runtime MUST return the same outcome for a repeated id rather than
// performing the work twice, which is what makes a Swarmada-level retry and a
// transport-level retry safe together. No RPC here carries a sensor-stream
// frame — frames flow adapter → runtime directly, on the EdgeService pattern
// (design Principle 3), never through this control channel and never through
// the control plane.
// ═══════════════════════════════════════════════════════════════════════════
service ComputeRuntimeService {
  // Activate starts (or, for a repeated Invocation.id, idempotently
  // re-acknowledges) a run. MUST return promptly: the control plane never
  // blocks a reconcile on the run's own completion.
  // Progress is observed via StreamStatus/Result on a later reconcile, never
  // by holding this call open for the run's duration.
  rpc Activate(ActivateRequest) returns (ActivateResponse);

  // StreamStatus server-streams TaskEvents raised since since_seq, reusing
  // fleet_adapter.v1.TaskEvent, unmodified, rather than a second event
  // message for a second execution kind. The control plane records each
  // seq at most once per action, across every run and invocation of it.
  rpc StreamStatus(StreamStatusRequest) returns (stream fleet_adapter.v1.TaskEvent);

  // Result returns the run's typed outcome: the single write-once terminal
  // ComputeResult for an App-contract run, or the running SUMMARY for a
  // Service-contract run — counts, duration, last observation,
  // never the observations themselves (RA-1: this is not a per-tick channel).
  rpc Result(ResultRequest) returns (ComputeResult);

  // Cancel requests the run stop, reusing fleet_adapter.v1.CancelDisposition:
  // the same three outcomes that apply to a robot action's cancel — stopped
  // safely, already completed, or recovered — apply identically to a compute
  // run's cancel.
  rpc Cancel(CancelRequest) returns (CancelResponse);

  // RenewLease keeps a Service-contract run alive past its resolved lease
  // horizon (design Principle 5: fail-safe is off — a run the control plane
  // stops renewing MUST self-stop; the inverse direction from Estop, which is
  // always honoured, never fenced). A missed renewal is the only way a
  // Service-contract run ends without an explicit Cancel or a self-reported
  // terminal TaskEvent — this is the mechanism behind streamPolicy and behind
  // "activated only for the time it needs to function".
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
}

// Invocation identifies one dispatch attempt.
//
// `id` is the idempotency key:
// "<namespace>/<action>/<runGeneration>/<attempt>" — the same shape as the Http
// binding's envelope (`invocation.id`), so a runtime serving both
// bindings dedups identically regardless of which one a given deployment uses.
//
// `run_generation` is the executor analogue of fleet_adapter.v1's per-robot
// fencing token: it IS FleetAction.status.assignmentGeneration, reinterpreted
// as the run's fencing value rather than a robot assignment's (decision doc
//  — "the same concept: a monotonic fencing token").
message Invocation {
  string id = 1;
  uint64 run_generation = 2;
  uint32 attempt = 3;
  int64 deadline_ms = 4; // 0 = no deadline
}

message ActivateRequest {
  Invocation invocation = 1;
  map<string, string> parameters = 2; // resolved ParameterBinding values, scalars only
}

message ActivateResponse {
  bool accepted = 1;
  string message = 2;
}

message StreamStatusRequest {
  string invocation_id = 1;
  uint64 since_seq = 2; // resume point: events after this seq are replayed; 0 = from the start
}

message ResultRequest {
  string invocation_id = 1;
}

// ComputeResult mirrors api/v1.ActionResult: scalars only in
// values (at most 16 entries, 4 KiB total — enforced by the caller, not this
// wire shape), artifacts are references, never inline bytes (at most 8
// entries). `status` reuses the Http binding envelope's vocabulary, so
// both bindings report outcomes the same way.
message ComputeResult {
  string status = 1; // "Succeeded" | "Failed"
  map<string, string> values = 2;
  repeated ComputeArtifact artifacts = 3;
  string message = 4;
  int64 produced_at_ms = 5;
}

message ComputeArtifact {
  string name = 1;
  string uri = 2;
  string media_type = 3;
  string digest = 4;
  int64 captured_at_ms = 5;
}

message CancelRequest {
  string invocation_id = 1;
  string reason = 2;
}

message CancelResponse {
  bool acknowledged = 1;
  string message = 2;
  fleet_adapter.v1.CancelDisposition disposition = 3;
}

message RenewLeaseRequest {
  string invocation_id = 1;
  int64 lease_expires_ms = 2;
}

message RenewLeaseResponse {
  bool renewed = 1;
  string message = 2;
}
