#
# Cross-platform release builds for swarmtop. Runs via `goreleaser release
# --clean` on a v* tag push (see .github/workflows/release.yml). Publishes to
# a Homebrew tap and a Scoop bucket so most users never need Go installed.

version: 2

builds:
  - id: swarmtop
    main: ./cmd/swarmtop
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64 # revisit once Windows/ARM demand exists; not a priority
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: swarmada
      name: homebrew-tap
    homepage: "https://swarmada.io"
    description: "A read-only terminal fleet inspector for Swarmada."
    license: "Apache-2.0"

scoops:
  - repository:
      owner: swarmada
      name: scoop-bucket
    homepage: "https://swarmada.io"
    description: "A read-only terminal fleet inspector for Swarmada."
    license: "Apache-2.0"

release:
  github:
    owner: swarmada
    name: swarmtop
