[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmada"
version = "0.4.0"
description = "Swarmada – robot fleet orchestration (simulation, ML, tooling)"
readme = "README.md"
# 3.12 is the floor the dependency set actually permits: numpy requires >=3.12 and scikit-learn
# >=3.11, so this package has not been installable on 3.10 for some time — the previous ">=3.10"
# overstated support rather than describing it.
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    # The oldest runtimes the committed Python stubs (proto/**/*_pb2*.py) are tested
    # against. The stubs are generated by grpcio-tools 1.64.1 (the `codegen` extra below),
    # whose output carries no protobuf runtime-version check and requires grpcio>=1.64.1.
    "grpcio>=1.64.1",
    "protobuf>=3.20.3",
    "pydantic>=2.5",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The Python stub generator, pinned: the generator decides the runtime floor baked into the
# committed stubs, and every adapter imports them. 1.64.1 is the newest release whose output
# imports on protobuf 3.20.3 / grpcio 1.64.1 (what ROS 2 Humble robot images carry) and on
# current runtimes alike; 1.65 and later demand a newer grpcio, and 1.66 and later also call a
# protobuf runtime check that 3.20 does not have. It is an extra, not a base dependency,
# because it has no wheel above Python 3.12 and requires protobuf<6. `make proto-py` runs it
# in an isolated environment when the active interpreter does not carry it.
codegen = ["grpcio-tools==1.64.1"]
simulation = [
    # rclpy ships with the ROS 2 environment; install via rosdep, not pip
    "transforms3d>=0.4",
]
ml = [
    "torch>=2.2",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    # Pinned, not floored: `make lint-py` is a gate, and a floor made it a different linter on
    # every machine -- PATH's ruff locally, the newest release in CI, 0.16.2 in uv.lock. The
    # Makefile reads this line (RUFF_VERSION) and refuses any other version. The cost is that
    # new rules and fixes arrive only when this line is bumped; bump it deliberately, run
    # `uv lock`, and fix what the new version finds in the same change.
    "ruff==0.16.2",
    "mypy>=1.9",
    # tests/python/test_model_runtime.py verifies real ECDSA/cosign signatures with it and
    # skips (importorskip) when it is absent; carried here so the suite runs rather than skips.
    "cryptography>=42",
]

# ---------------------------------------------------------------------------
# Tool configuration (PyCharm honours all of these)
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
# NOTE (fixed 2026-07-10): "adapters*" was missing here, so `pip install -e .`
# / a wheel build silently dropped the whole adapters/ package (simulation
# adapter, scenarios loader, conformance harness, template, example-noop).
# This only worked in practice because `make conformance*`/`make test-py` run
# `python -m adapters...` / pytest from the repo root, which puts the repo
# root on sys.path regardless of what setuptools thinks is installed — a real
# `pip install .` from outside the repo, or a built wheel, would break.
include = ["simulation*", "scripts*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
# `make lint-py` runs `ruff check .`, so this list IS the lint scope: anything not named here is
# linted, including a directory added tomorrow. (A subdirectory's own ruff.toml may extend this
# file and add exclusions of its own, under the same rule.) Every entry says why it is out. Adding
# one needs a reason on the same line, and "it fails" is not a reason; see Makefile lint-py.
extend-exclude = [
    # Never linted -- not Python source this repository writes by hand:
    "proto/*",                  # generated by `make proto-py`; hand fixes would be overwritten
    "adapters/template/*",      # cookiecutter source: Jinja in paths, imports and pyproject.toml,
                                # so it is not parseable as Python or TOML until rendered.
                                # `make check-adapter-template` (in lint-py) renders it and
                                # lints the RENDERED copy under these rules instead
    "_backups/*",               # point-in-time copies of other files, not source
    ".audit4-edits/*",          # one-shot edit scripts from a past audit, not source
]
# The package needs 3.12, so ruff infers py312 and its UP fixes emit 3.12-only syntax. The spec
# assembler promises to run "on any Python 3 with no install" (its Makefile target uses whatever
# $(PYTHON) is), so it is held to 3.9: at py312 ruff proposed, and this gate passed, an f-string
# that is a SyntaxError on 3.9-3.11.
# `conformance/` is held to py310 for the same reason and by the same mechanism: the robot's
# vendor container is Python 3.10.12 and that package has to import on it (conformance/README.md,
# Prerequisites). At the inferred py312 ruff's UP rules propose 3.11+ spellings -- UP017 asks for
# `datetime.UTC`, UP042 for `enum.StrEnum` -- each of which is an AttributeError on the robot, and
# a linter that proposes them is a linter arguing with
# tests/python/test_conformance_runs_on_the_harness_floor.py.
per-file-target-version = { "rfcs/assemble.py" = "py39", "conformance/*.py" = "py310" }

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.ruff.lint.pep8-naming]
# N802 (function names lowercase) cannot apply to a gRPC servicer: the method name IS the RPC
# name in the .proto, and grpcio dispatches on it, so `controlstream` would compile and never be
# called. These are every rpc in proto/fleet_adapter/v1 and proto/compute/v1. Kept here rather
# than as inline `# noqa` because black moved one such noqa off the `def` line it had to sit on.
extend-ignore-names = [
    "ControlStream", "SafetyStream", "EdgeStream",                          # FleetAdapterService
    "Activate", "StreamStatus", "Result", "Cancel", "RenewLease",           # compute.v1
]

[tool.mypy]
# Matches requires-python above. Type-checking against a lower version would check a configuration
# that cannot be installed (numpy requires >=3.12), and fails outright on numpy's PEP 695 stubs.
python_version = "3.12"
strict = true
exclude = ["proto/"]   # generated code

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
