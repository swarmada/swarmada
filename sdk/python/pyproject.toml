[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmada-sdk"
version = "0.0.1"
description = "Python SDK for the Swarmada fleet-orchestration control plane"
readme = "README.md"
# Aligned with the control plane's floor (root pyproject.toml). The SDK's own dependencies
# (grpcio) still support 3.10, so this is a deliberate consistency choice rather than a
# technical constraint: one Python floor across the repository, at the cost of excluding adapter
# authors on 3.10/3.11.
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "The Swarmada Authors" }]
keywords = ["swarmada", "robotics", "fleet", "orchestration", "kubernetes"]
dependencies = [
    "grpcio>=1.62",
    # The committed *_pb2.py gencode is generated by protoc 6.33.5 and calls
  # runtime_version.ValidateProtobufRuntimeVersion(..., 6, 33, 5, ...), which does not
  # exist before protobuf 5.27 and demands a 6.x runtime. A >=4.25 floor named a version
  # the code provably cannot import: anyone installing per the declared dependencies got
  # an ImportError on first import. Keep this floor in step with the generator.
  "protobuf>=6.33.5",
]

# The SDK is versioned INDEPENDENTLY of the control plane (see ADR-0002). It is
# packaged from day one so extraction to its own repository is a history-move,
# not a rewrite. Until then it builds from this subtree.
[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.urls]
Homepage = "https://github.com/swarmada/swarmada"
Source = "https://github.com/swarmada/swarmada/tree/main/sdk/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swarmada_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
