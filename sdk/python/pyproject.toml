[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmada-sdk"
version = "0.1.0"
description = "Python SDK for the Swarmada fleet-orchestration control plane"
readme = "README.md"
# 3.10 — the interpreter ROS 2 Humble ships, which is the current ROS 2 LTS (Ubuntu 22.04,
# supported to May 2027) and therefore most deployed robots. This read ">=3.12", copied from
# the control plane's root pyproject for consistency. That floor is real THERE — numpy
# requires >=3.12 and scikit-learn >=3.11 — but neither is an SDK dependency. The SDK needs
# grpcio and protobuf, and both support 3.10. The consistency was with a constraint this
# package does not have, and its documented cost, "excluding adapter authors on 3.10/3.11",
# falls precisely on the robots adapters run on.
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "The Swarmada Authors" }]
keywords = ["swarmada", "robotics", "fleet", "orchestration", "kubernetes"]
dependencies = [
    # The SDK itself imports neither; an adapter built on it imports the fleet_adapter.v1
    # stubs, and these are the oldest runtimes those stubs are tested against (the repository
    # root's pyproject.toml records the generator pin and why). Raising either floor would
    # make a robot that already carries a working runtime install a second one.
    "grpcio>=1.64.1",
    "protobuf>=3.20.3",
]

# The SDK is versioned INDEPENDENTLY of the control plane (see ADR-0002). It is
# packaged from day one so extraction to its own repository is a history-move,
# not a rewrite. Until then it builds from this subtree.
[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.urls]
Homepage = "https://github.com/swarmada/swarmada"
Source = "https://github.com/swarmada/swarmada/tree/main/sdk/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swarmada_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
